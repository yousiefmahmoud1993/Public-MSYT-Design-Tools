    torsion: function(v){ return {sheet: "Torsion", set: put({}, {fc: "C11", fyt: "C12", fy: "C13", tu: "B17", bw: "D17", h: "E17", vu: "G17", dbs: ["B41", "D44"], dbl: "D48"}, v)}; },
    shear: function(v){ var s = put({}, {fc: "C10", fyt: "C11", vu: "B16", nu: "C16", bw: "D16", d: "E16", h: "F16", br: "G16", as: "H16", db: "N16"}, v); s.I12 = pick({a: "Eq. 22.5.5.1 (a)", b: "Eq. 22.5.5.1 (b)"}, v.eq); return {sheet: "Shear", set: s}; },
    shearfr: function(v){ return {sheet: "Shear-friction", set: put({}, {fc: "C11", fy: "C12", vu: "B21", b: "C21", h: "D21", mu: "E21", ang: "F21", db: "L21"}, v)}; },

    defl: function(v){

    },
    moi: function(v){

    },
    tsec: function(v){ return {sheet: "I-Tsec", set: put({}, {B: "D11", ts: "B13", h: "C18", bw: "E27"}, v)}; },
    water: function(v){
      var s = put({}, {fc: "C11", fy: "C12", B: "C21", t: "C22", ms: "C23", ns: "C24", ct: "C32", ntb: "C34", dbt: "E34", ncb: "C35", dbc: "E35", cc: "C36", len: "C47"}, v);

    },
    crack224: function(v){
      var s = put({}, {fc: "C11", fy: "C12", B: "C21", t: "C22", ntb: "C23", dbt: "E23", ct: "C24", ncb: "C27", dbc: "E27", cc: "C28", ms: "C30", ns: "C31"}, v);

      s.C34 = pick(ENV, v.env); s.D35 = pick(SYS, v.sys);
      s.C26 = pick({"a": "0.75 - 0.50", "b": "< 0.50"}, v.rat); s.G26 = pick({"1": "Continuous", "1.5": "Simple"}, v.span);
      return {sheet: "Crack", set: s};
    }
  };
  window.KATEB_XLSX = {file: "El-Kateb-Excel-Sheet-v4.8.xlsx", sheets: {

<script>
function mountRcApp(root) {
  const document = root;

"use strict";
// Engineering core, ACI 318M (SI). Units: mm, MPa, N, N.mm.
var ES = 200000;      // steel modulus, MPa
var EPS_CU = 0.003;   // ultimate concrete strain

// Whitney stress block depth factor beta1 (ACI 318M 22.2.2.4.3)
function beta1ACI(fc) {
  if (fc <= 28) return 0.85;
  return Math.max(0.65, 0.85 - 0.05 * (fc - 28) / 7);
}

// Strength reduction factor phi vs net tensile strain (tied reinforcement).
function phiACI(et, fy) {
  var ety = fy / ES;
  if (et <= ety) return 0.65;                 // compression-controlled (tied)
  if (et >= ety + 0.003) return 0.90;         // tension-controlled
  return 0.65 + (et - ety) * 0.25 / 0.003;    // transition
}

// Nominal axial force at neutral axis depth c (compression +). Layers: [{d, As}].
function axialAt(b, h, layers, fc, fy, c) {
  var a = Math.min(beta1ACI(fc) * c, h);
  var n = 0.85 * fc * b * a;
  for (var i = 0; i < layers.length; i++) {
    var eps = EPS_CU * (c - layers[i].d) / c;
    var fs = Math.max(-fy, Math.min(fy, ES * eps));
    n += fs * layers[i].As;
  }
  return n;
}

// Nominal moment capacity (magnitude) about the gross-section centroid at c.
function momentAt(b, h, layers, fc, fy, c) {
  var a = Math.min(beta1ACI(fc) * c, h);
  var m = 0.85 * fc * b * a * (h / 2 - a / 2);
  for (var i = 0; i < layers.length; i++) {
    var eps = EPS_CU * (c - layers[i].d) / c;
    var fs = Math.max(-fy, Math.min(fy, ES * eps));
    m -= fs * layers[i].As * (layers[i].d - h / 2);
  }
  return m;
}

// Find c for a target nominal axial force. null if out of range.
function neutralAxisForPn(b, h, layers, fc, fy, pnTarget) {
  var lo = 1e-4, hi = 100 * h;
  if (pnTarget > axialAt(b, h, layers, fc, fy, hi)) return null;
  if (pnTarget < axialAt(b, h, layers, fc, fy, lo)) return null;
  for (var i = 0; i < 200; i++) {
    var mid = 0.5 * (lo + hi);
    if (axialAt(b, h, layers, fc, fy, mid) > pnTarget) hi = mid; else lo = mid;
  }
  return 0.5 * (lo + hi);
}

// Combined check at factored (Nu, Mu). Iterates phi (it depends on strain).
// Returns {ok, phiMn, phi, c, et, reason}.
function combinedCheck(b, h, layers, fc, fy, dMax, nuN, muNmm) {
  var asTot = 0;
  for (var i = 0; i < layers.length; i++) asTot += layers[i].As;
  var p0 = 0.85 * fc * (b * h - asTot) + fy * asTot;
  var phiPnMax = 0.80 * 0.65 * p0;           // tied column cap, ACI 318M 22.4.2.2
  if (nuN > phiPnMax) return { ok: false, reason: "phiPnMax", phiPnMax: phiPnMax, p0: p0 };
  if (nuN < -0.9 * fy * asTot) return { ok: false, reason: "tensionCap" };

  var phi = 0.65, c = 0;
  for (var it = 0; it < 60; it++) {
    var cNew = neutralAxisForPn(b, h, layers, fc, fy, nuN / phi);
    if (cNew === null) return { ok: false, reason: "range" };
    c = cNew;
    var et = EPS_CU * (dMax - c) / c;
    var phiNew = phiACI(et, fy);
    if (Math.abs(phiNew - phi) < 1e-4) { phi = phiNew; break; }
    phi = phiNew;
  }
  var etF = EPS_CU * (dMax - c) / c;
  var mn = momentAt(b, h, layers, fc, fy, c);
  return { ok: phi * mn >= muNmm, phiMn: phi * mn, mn: mn, phi: phi, c: c, et: etF,
           phiPnMax: phiPnMax, p0: p0 };
}

// Pure-bending capacity (Nu = 0). Returns {phiMn, c, et, phi}.
function bendingCapacity(b, h, layers, fc, fy, dMax) {
  var c = neutralAxisForPn(b, h, layers, fc, fy, 0);
  if (c === null) return null;
  var et = EPS_CU * (dMax - c) / c;
  var phi = phiACI(et, fy);
  return { phiMn: phi * momentAt(b, h, layers, fc, fy, c), c: c, et: et, phi: phi };
}

// Moment-only design (ACI 318M, phi = 0.90, tension-controlled target et = 0.005).
// Returns {singly, asReq, asPrime, et, a, c, fsPrime, asMin, governedByMin}.
function designMoment(b, h, d, dp, fc, fy, muNmm) {
  var phi = 0.9;
  var mnReq = muNmm / phi;
  var beta1 = beta1ACI(fc);
  var asMin = Math.max(0.25 * Math.sqrt(fc) / fy, 1.4 / fy) * b * d;

  // Try singly reinforced.
  var disc = d * d - 2 * mnReq / (0.85 * fc * b);
  if (disc >= 0) {
    var a = d - Math.sqrt(disc);
    var c = a / beta1;
    var et = EPS_CU * (d - c) / c;
    if (et >= 0.005) {
      var as = 0.85 * fc * a * b / fy;
      var gov = false;
      if (as < asMin) { as = asMin; gov = true; }
      return { singly: true, asReq: as, asPrime: 0, et: et, a: a, c: c, asMin: asMin, governedByMin: gov };
    }
  }
  // Doubly reinforced, set tension strain to 0.005 (tension-controlled limit).
  var c2 = 0.375 * d;
  var a2 = beta1 * c2;
  var mn1 = 0.85 * fc * b * a2 * (d - a2 / 2);
  var dMn = mnReq - mn1;
  var epsSP = EPS_CU * (c2 - dp) / c2;
  var fsPrime = Math.min(fy, ES * epsSP);
  var asPrime = dMn / (fsPrime * (d - dp));
  var as2 = dMn / (fy * (d - dp));
  var as1 = 0.85 * fc * a2 * b / fy;
  return { singly: false, asReq: as1 + as2, asPrime: asPrime, et: 0.005, a: a2, c: c2,
           fsPrime: fsPrime, mn1: mn1, dMn: dMn, asMin: asMin, governedByMin: false };
}

// Design with axial: grow tension steel until combined check passes.
function designWithAxial(b, h, d, dp, asStart, asPrime, fc, fy, muNmm, nuN) {
  var as = asStart, last = null;
  for (var i = 0; i < 300; i++) {
    last = combinedCheck(b, h, [{d: d, As: as}, {d: dp, As: asPrime}], fc, fy, d, nuN, muNmm);
    if (last.reason === "phiPnMax" || last.reason === "tensionCap") return { as: as, ok: false, last: last };
    if (last.ok) return { as: as, ok: true, last: last };
    as *= Math.max(1.01, muNmm / Math.max(last.phiMn, 1));
  }
  return { as: as, ok: false, last: last };
}

// Concrete elastic modulus, ACI 318M 19.2.2.1 (MPa)
function ecACI(fc) { return 4700 * Math.sqrt(fc); }

// Cracked-section neutral axis and moment of inertia (elastic, service).
function crackedSection(b, d, dp, asT, asC, fc) {
  var n = ES / ecACI(fc);
  var A2 = b / 2;
  var B2 = (n - 1) * asC + n * asT;
  var C2 = -((n - 1) * asC * dp + n * asT * d);
  var x = (-B2 + Math.sqrt(B2 * B2 - 4 * A2 * C2)) / (2 * A2);
  var icr = b * Math.pow(x, 3) / 3 + (n - 1) * asC * Math.pow(x - dp, 2) + n * asT * Math.pow(d - x, 2);
  return { x: x, icr: icr, n: n };
}

// ACI 318 10.6 crack control. Returns spacing check + optional Gergely-Lutz estimate.
function crackControl(b, h, d, dp, nb, db, cc, asC, fc, fy, msNmm) {
  var asT = nb * Math.PI / 4 * db * db;
  var fs, fsSource;
  if (msNmm > 0) {
    var cs = crackedSection(b, d, dp, asT, asC, fc);
    fs = cs.n * msNmm * (d - cs.x) / cs.icr;
    fsSource = "calc";
    var x = cs.x;
  } else {
    fs = 2 * fy / 3;
    fsSource = "twoThirds";
    x = null;
  }
  var sMax1 = 380 * (280 / fs) - 2.5 * cc;
  var sMax2 = 300 * (280 / fs);
  var sMax = Math.min(sMax1, sMax2);
  var sActual = (nb > 1) ? (b - 2 * cc - nb * db) / (nb - 1) : Infinity;

  // Gergely-Lutz estimate (NOT in current ACI 318; shown for reference only).
  var wEst = null, beta = null, aEff = null;
  if (x !== null) {
    beta = (h - x) / (d - x);          // h2/h1
    var dc = h - d;
    aEff = 2 * dc * b / nb;            // concrete area per bar
    wEst = 11e-6 * beta * fs * Math.cbrt(dc * aEff);  // mm
  }
  return { fs: fs, fsSource: fsSource, sMax: sMax, sActual: sActual,
           pass: sActual <= sMax, wEst: wEst, beta: beta, x: x };
}

// ---------- generic UI helpers ----------
function g(id){ var el = document.getElementById(id); return el ? el.value : ""; }
function gn(id){ var v = parseFloat(g(id)); return isFinite(v) ? v : 0; }

function abar(db){ return Math.PI / 4 * db * db; }
function b1sheet(fc){ return fc <= 28 ? 0.85 : (fc >= 55 ? 0.65 : 0.85 - 0.05 * (fc - 28) / 7); }
function rows(t){ return "<table><tr><th>Item</th><th>Value</th></tr>" + t.map(function(r){ return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; }).join("") + "</table>"; }

function field(f){
  var inner;

  } else if (f.type === "sel") {

  } else {

  }
  return "<div><label>" + f.label + (f.unit ? " (" + f.unit + ")" : "") + "</label>" + inner + "</div>";
}
function fieldRows(fields, perRow){
  var out = "", cur = null, buf = [];
  function flush(){
    if (cur === null) return;
    var rows = "";
    for (var i = 0; i < buf.length; i += perRow) {
      rows += "<div class='row'>" + buf.slice(i, i + perRow).map(field).join("") + "</div>";
    }
    out += (cur === "" ? rows : "<div class='fgrp'><div class='fgrp-t'>" + cur + "</div>" + rows + "</div>");
  }
  fields.forEach(function(f){
    var gname = f.grp || "";
    if (gname !== cur) { flush(); cur = gname; buf = []; }
    buf.push(f);
  });
  flush();
  return out;
}
var MODULES = [];

});

function barSuggest(b, cover, asReq, db, label){
  if (asReq<=0||db<=0) return "";

    {k:"mu", grp:"Loads", label:"Moment Mu", unit:"kN.m", def:200}
  ],
  run: function(){
    var fc=gn("f_fc"),fy=gn("f_fy"),Mu=gn("f_mu"),b=gn("f_b"),B=gn("f_B"),ts=gn("f_ts"),side=g("f_side"),d=gn("f_d"),cover=gn("f_cover"),db=gn("f_db"),dbc=gn("f_dbc");
    var fymax=Math.min(fy,550);
    var V=(side==="Comp.")?B:b;

    ws += eqv("a = " + fmt(d, 0) + " − " + rad(fmt(d, 0) + "² − " + fr("2 × " + fmt(Mu * 1e6, 0), "0.85 × 0.9 × " + fmt(fc, 1) + " × " + fmt(V, 0))));
    ws += eqr("a = " + fmt(a, 1) + " mm");

    ws += eqv("c<sub>max</sub>" + " = " + fmt(AH, 1) + " mm");

    ws += eqs("M<sub>max</sub> = 0.9 · 0.85 f′<sub>c</sub> a<sub>max</sub> V (d − " + fr("a<sub>max</sub>", "2") + ")");

      ws += eqs("A′<sub>s</sub> = " + fr("M<sub>u</sub> − M<sub>max</sub>", "f<sub>y</sub> (d − d′)"));

      ws += eqv("A<sub>s,used</sub>" + " = " + fmt(AL, 0) + " + " + fmt(AK, 0));

    out += ws;

// Shared sheet helpers for foundations (footing/combined/pile sheets)
function abarS(db){ return 3.14/4*db*db; }            // sheets use 3.14 for bar area
function quadAs(Mu, b, d, fc, fy){                     // Mu in N.mm -> As mm2 (sheet quadratic)
  var A=0.85*fc*0.9*b/2, B=-0.85*0.9*fc*b*d;
  var a=(-B-Math.sqrt(B*B-4*A*Mu))/(2*A);
  return 0.85*fc*a*b/fy;
}
function sheetCrack(fc, t, db, sp, Mser, limit){       // sheet crack-width block (fs check + w)
  var a=500, n=200000/4700/Math.sqrt(fc);
  var B=n*Math.PI/4*db*db*1000/sp, C=-B*(t-70);
  var z=(Math.sqrt(B*B-4*a*C)-B)/(2*a);
  var I=1000*Math.pow(z,3)/3+B*Math.pow(t-70-z,2);
  var fs=Mser*1e6*(t-70-z)/I*n;
  var beta=(t-z)/(t-70-z);
  var fsmax2=56000/beta/Math.sqrt(sp*sp+4*Math.pow(50+db/2,2));
  var fsall=Math.min(250, Math.max(fsmax2,165));
  var w=0.076*beta*fs*0.145*Math.pow(70/25.4*(140*sp)/25.4/25.4, 1/3)/1000*25.4;
  return {z:z, fs:fs, beta:beta, fsall:fsall, w:w, okW:w<=limit, okFs:fs<=fsall};
}
function crackHtml(r, limit){
  return rows([["Z", fmt(r.z,1)+" mm"],["fs", fmt(r.fs,1)+" MPa"],["β", fmt(r.beta,3)],
    ["fs (allowable)", fmt(r.fsall,1)+" MPa"],["w", fmt(r.w,3)+" mm"],["Limit", fmt(limit,2)+" mm"]])
    + okbad(r.okFs, "fs acceptable","fs not acceptable") + " " + okbad(r.okW, "Crack width acceptable","Crack width not acceptable");
}

function pileMomentGrid(nl,ns,sl,ss,avg,M){
  var rows=[],sumY2=0,sumP=0,sumM=0;
  for(var i=0;i<nl;i++){var y=(i-(nl-1)/2)*sl;rows.push({y:y});sumY2+=ns*y*y;}
  rows.forEach(function(o){o.p=avg+M*o.y/sumY2;sumP+=ns*o.p;sumM+=ns*o.p*o.y;});
  return {rows:rows,sumY2:sumY2,sumP:sumP,sumM:sumM};
}

MODULES.push({

  var nPages = pages.length, pageObjStart = 5, objs = [], kids = [];
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  for (var p = 0; p < nPages; p++) kids.push((pageObjStart + p * 2) + " 0 R");

  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  var imgBase = pageObjStart + nPages * 2, imgRes = "";
  if (pdfImgs.length) { imgRes = " /XObject <<"; for (var q2 = 0; q2 < pdfImgs.length; q2++) { imgRes += " /Im" + q2 + " " + (imgBase + q2) + " 0 R"; objs[imgBase + q2] = "<< /Type /XObject /Subtype /Image /Width " + pdfImgs[q2].w + " /Height " + pdfImgs[q2].h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + pdfImgs[q2].bin.length + " >>\nstream\n" + pdfImgs[q2].bin + "\nendstream"; } imgRes += " >>"; }
  for (var p2 = 0; p2 < nPages; p2++) {
    var contentId = pageObjStart + p2 * 2 + 1;
    var stream = pages[p2].join("\n");

      if(candidate._pages===pages.length){best=candidate;low=mid;}else high=mid;

}
function printGeneratedPdf(){

function pdfFileName(){

function sheetNote(msg){

function downloadPdf(){
  if (window.isNativeApp && window.isNativeApp()) { window.nativePdf(buildPdf(sheetLines()), pdfFileName()); return; }
  try {
    var blob = buildPdf(sheetLines());

      return;
    }
    if (window.XLSX && window.XLSX.save && /iPad|iPhone|iPod/.test(navigator.userAgent || "")) { window.XLSX.save(blob, pdfFileName()); return; }
    var url = URL.createObjectURL(blob);

    var a = doc.createElement("a");

    a.download = pdfFileName();
    doc.body.appendChild(a);

  } catch (e) { window.print(); }
}
function sharePdf(){
  if (window.isNativeApp && window.isNativeApp()) { window.nativePdf(buildPdf(sheetLines()), pdfFileName()); return; }

var currentMod = null;

function exportExcel(){
  var m = currentMod, v = {}, note = function(t){ var r = g2("res"); if (r) { var d = r.ownerDocument.createElement("div"); d.className = "warn"; d.textContent = t; r.insertBefore(d, r.firstChild); r.style.display = "block"; } };

      var ed = m.tpl.cells(v), list = Object.keys(ed).map(function(ref){ return {ref: ref, v: ed[ref]}; });

        .then(function(buf){ XLSX.save(XLSX.patchTemplate(buf, sh.path, edits, sh.tab), "El-Kateb - " + r.sheet.replace(/[^A-Za-z0-9 -]+/g, " ").trim() + ".xlsx"); })
        .catch(function(e){ note("Excel export failed: " + e.message); });
      return;
    }
    // tools without an Excel sheet: inputs + results as a workbook
    var rows = [[{v: m.title, s: 1}], [{v: "Values exported from the app (this tool has no Excel sheet). " + new Date().toLocaleString("en-GB"), s: 5}], [], [{v: "INPUTS", s: 2}, {v: "", s: 2}, {v: "", s: 2}]];
    m.fields.forEach(function(f){ rows.push([f.label, {v: v[f.k], s: 3}, f.unit || ""]); });

function handleAction(target){
  var el = target && target.closest ? target.closest("[data-mod],[data-action],[data-view],#backBtn") : null;
  if (!el) return false;
  if (el.id === "backBtn") { if (histPushed) { history.back(); } else { goHome(); } return true; }
  if (el.getAttribute("data-action") === "run") { runMod(); return true; }
  if (el.getAttribute("data-action") === "print") { printSheet(); return true; }
  if (el.getAttribute("data-action") === "doprint") { printGeneratedPdf(); return true; }
  if (el.getAttribute("data-action") === "dlpdf") { downloadPdf(); return true; }
  if (el.getAttribute("data-action") === "dlxlsx") { exportExcel(); return true; }
  if (el.getAttribute("data-action") === "sharepdf") { sharePdf(); return true; }
  if (el.getAttribute("data-action") === "pdm") { setPdm(el.getAttribute("data-pdmv")); return true; }
  if (el.getAttribute("data-action") === "printback") { var pv = g2("printView"); if (pv) pv.remove(); g2("modPage").classList.remove("printing"); return true; }
  var vw = el.getAttribute("data-view");
  if (vw) { setView(vw); return true; }
  var mod = el.getAttribute("data-mod");
  if (mod) { openModule(mod); return true; }
  return false;
}
