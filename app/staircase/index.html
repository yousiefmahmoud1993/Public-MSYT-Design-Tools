<script>
function mountRcApp(root) {
  const document = root;

"use strict";
// Engineering core, ACI 318M (SI). Units: mm, MPa, N, N.mm.
var ES = 200000;      // steel modulus, MPa
var EPS_CU = 0.003;   // ultimate concrete strain

// Whitney stress block depth factor beta1 (ACI 318M 22.2.2.4.3)
function beta1ACI(fc) {
  if (fc <= 28) return 0.85;
  return Math.max(0.65, 0.85 - 0.05 * (fc - 28) / 7);
}

// Strength reduction factor phi vs net tensile strain (tied reinforcement).
function phiACI(et, fy) {
  var ety = fy / ES;
  if (et <= ety) return 0.65;                 // compression-controlled (tied)
  if (et >= ety + 0.003) return 0.90;         // tension-controlled
  return 0.65 + (et - ety) * 0.25 / 0.003;    // transition
}

// Nominal axial force at neutral axis depth c (compression +). Layers: [{d, As}].
function axialAt(b, h, layers, fc, fy, c) {
  var a = Math.min(beta1ACI(fc) * c, h);
  var n = 0.85 * fc * b * a;
  for (var i = 0; i < layers.length; i++) {
    var eps = EPS_CU * (c - layers[i].d) / c;
    var fs = Math.max(-fy, Math.min(fy, ES * eps));
    n += fs * layers[i].As;
  }
  return n;
}

// Nominal moment capacity (magnitude) about the gross-section centroid at c.
function momentAt(b, h, layers, fc, fy, c) {
  var a = Math.min(beta1ACI(fc) * c, h);
  var m = 0.85 * fc * b * a * (h / 2 - a / 2);
  for (var i = 0; i < layers.length; i++) {
    var eps = EPS_CU * (c - layers[i].d) / c;
    var fs = Math.max(-fy, Math.min(fy, ES * eps));
    m -= fs * layers[i].As * (layers[i].d - h / 2);
  }
  return m;
}

// Find c for a target nominal axial force. null if out of range.
function neutralAxisForPn(b, h, layers, fc, fy, pnTarget) {
  var lo = 1e-4, hi = 100 * h;
  if (pnTarget > axialAt(b, h, layers, fc, fy, hi)) return null;
  if (pnTarget < axialAt(b, h, layers, fc, fy, lo)) return null;
  for (var i = 0; i < 200; i++) {
    var mid = 0.5 * (lo + hi);
    if (axialAt(b, h, layers, fc, fy, mid) > pnTarget) hi = mid; else lo = mid;
  }
  return 0.5 * (lo + hi);
}

// Combined check at factored (Nu, Mu). Iterates phi (it depends on strain).
// Returns {ok, phiMn, phi, c, et, reason}.
function combinedCheck(b, h, layers, fc, fy, dMax, nuN, muNmm) {
  var asTot = 0;
  for (var i = 0; i < layers.length; i++) asTot += layers[i].As;
  var p0 = 0.85 * fc * (b * h - asTot) + fy * asTot;
  var phiPnMax = 0.80 * 0.65 * p0;           // tied column cap, ACI 318M 22.4.2.2
  if (nuN > phiPnMax) return { ok: false, reason: "phiPnMax", phiPnMax: phiPnMax, p0: p0 };
  if (nuN < -0.9 * fy * asTot) return { ok: false, reason: "tensionCap" };

  var phi = 0.65, c = 0;
  for (var it = 0; it < 60; it++) {
    var cNew = neutralAxisForPn(b, h, layers, fc, fy, nuN / phi);
    if (cNew === null) return { ok: false, reason: "range" };
    c = cNew;
    var et = EPS_CU * (dMax - c) / c;
    var phiNew = phiACI(et, fy);
    if (Math.abs(phiNew - phi) < 1e-4) { phi = phiNew; break; }
    phi = phiNew;
  }
  var etF = EPS_CU * (dMax - c) / c;
  var mn = momentAt(b, h, layers, fc, fy, c);
  return { ok: phi * mn >= muNmm, phiMn: phi * mn, mn: mn, phi: phi, c: c, et: etF,
           phiPnMax: phiPnMax, p0: p0 };
}

// Pure-bending capacity (Nu = 0). Returns {phiMn, c, et, phi}.
function bendingCapacity(b, h, layers, fc, fy, dMax) {
  var c = neutralAxisForPn(b, h, layers, fc, fy, 0);
  if (c === null) return null;
  var et = EPS_CU * (dMax - c) / c;
  var phi = phiACI(et, fy);
  return { phiMn: phi * momentAt(b, h, layers, fc, fy, c), c: c, et: et, phi: phi };
}

// Moment-only design (ACI 318M, phi = 0.90, tension-controlled target et = 0.005).
// Returns {singly, asReq, asPrime, et, a, c, fsPrime, asMin, governedByMin}.
function designMoment(b, h, d, dp, fc, fy, muNmm) {
  var phi = 0.9;
  var mnReq = muNmm / phi;
  var beta1 = beta1ACI(fc);
  var asMin = Math.max(0.25 * Math.sqrt(fc) / fy, 1.4 / fy) * b * d;

  // Try singly reinforced.
  var disc = d * d - 2 * mnReq / (0.85 * fc * b);
  if (disc >= 0) {
    var a = d - Math.sqrt(disc);
    var c = a / beta1;
    var et = EPS_CU * (d - c) / c;
    if (et >= 0.005) {
      var as = 0.85 * fc * a * b / fy;
      var gov = false;
      if (as < asMin) { as = asMin; gov = true; }
      return { singly: true, asReq: as, asPrime: 0, et: et, a: a, c: c, asMin: asMin, governedByMin: gov };
    }
  }
  // Doubly reinforced, set tension strain to 0.005 (tension-controlled limit).
  var c2 = 0.375 * d;
  var a2 = beta1 * c2;
  var mn1 = 0.85 * fc * b * a2 * (d - a2 / 2);
  var dMn = mnReq - mn1;
  var epsSP = EPS_CU * (c2 - dp) / c2;
  var fsPrime = Math.min(fy, ES * epsSP);
  var asPrime = dMn / (fsPrime * (d - dp));
  var as2 = dMn / (fy * (d - dp));
  var as1 = 0.85 * fc * a2 * b / fy;
  return { singly: false, asReq: as1 + as2, asPrime: asPrime, et: 0.005, a: a2, c: c2,
           fsPrime: fsPrime, mn1: mn1, dMn: dMn, asMin: asMin, governedByMin: false };
}

// Design with axial: grow tension steel until combined check passes.
function designWithAxial(b, h, d, dp, asStart, asPrime, fc, fy, muNmm, nuN) {
  var as = asStart, last = null;
  for (var i = 0; i < 300; i++) {
    last = combinedCheck(b, h, [{d: d, As: as}, {d: dp, As: asPrime}], fc, fy, d, nuN, muNmm);
    if (last.reason === "phiPnMax" || last.reason === "tensionCap") return { as: as, ok: false, last: last };
    if (last.ok) return { as: as, ok: true, last: last };
    as *= Math.max(1.01, muNmm / Math.max(last.phiMn, 1));
  }
  return { as: as, ok: false, last: last };
}

// Concrete elastic modulus, ACI 318M 19.2.2.1 (MPa)
function ecACI(fc) { return 4700 * Math.sqrt(fc); }

// Cracked-section neutral axis and moment of inertia (elastic, service).
function crackedSection(b, d, dp, asT, asC, fc) {
  var n = ES / ecACI(fc);
  var A2 = b / 2;
  var B2 = (n - 1) * asC + n * asT;
  var C2 = -((n - 1) * asC * dp + n * asT * d);
  var x = (-B2 + Math.sqrt(B2 * B2 - 4 * A2 * C2)) / (2 * A2);
  var icr = b * Math.pow(x, 3) / 3 + (n - 1) * asC * Math.pow(x - dp, 2) + n * asT * Math.pow(d - x, 2);
  return { x: x, icr: icr, n: n };
}

// ACI 318 10.6 crack control. Returns spacing check + optional Gergely-Lutz estimate.
function crackControl(b, h, d, dp, nb, db, cc, asC, fc, fy, msNmm) {
  var asT = nb * Math.PI / 4 * db * db;
  var fs, fsSource;
  if (msNmm > 0) {
    var cs = crackedSection(b, d, dp, asT, asC, fc);
    fs = cs.n * msNmm * (d - cs.x) / cs.icr;
    fsSource = "calc";
    var x = cs.x;
  } else {
    fs = 2 * fy / 3;
    fsSource = "twoThirds";
    x = null;
  }
  var sMax1 = 380 * (280 / fs) - 2.5 * cc;
  var sMax2 = 300 * (280 / fs);
  var sMax = Math.min(sMax1, sMax2);
  var sActual = (nb > 1) ? (b - 2 * cc - nb * db) / (nb - 1) : Infinity;

  // Gergely-Lutz estimate (NOT in current ACI 318; shown for reference only).
  var wEst = null, beta = null, aEff = null;
  if (x !== null) {
    beta = (h - x) / (d - x);          // h2/h1
    var dc = h - d;
    aEff = 2 * dc * b / nb;            // concrete area per bar
    wEst = 11e-6 * beta * fs * Math.cbrt(dc * aEff);  // mm
  }
  return { fs: fs, fsSource: fsSource, sMax: sMax, sActual: sActual,
           pass: sActual <= sMax, wEst: wEst, beta: beta, x: x };
}

function fieldRows(fields, perRow){

// Analysis, identical for both versions (sheet columns AS:AX and BQ:BS)
function stairAnalysis(i){
  var r = {};
  r.H = i.Ht - i.Hb;                                           // storey height (fix: sheet used top elevation only)
  r.run = i.X2 / i.N; r.rise = r.H / i.N;                      // M19, M20
  r.B = Math.max(i.Y1, i.Y3);                                  // MAX(Y1,Y3)
  r.G1 = i.Y1 * (i.t + 0.05) * 25;                             // AT5 (sheet uses Y1 only)
  r.G2 = (i.t + i.N * r.run * r.rise) * r.B * 25 / 2;          // AT6
  r.w1 = i.Gf * r.G1 + i.Qf * i.Q;                             // AT12
  r.w2 = i.Gf * r.G2 + i.Qf * i.Q;                             // AT13
  r.L1 = i.X1; r.L2 = Math.sqrt(i.X2 * i.X2 + r.H * r.H); r.L3 = i.X3; r.L = r.L1 + r.L2 + r.L3;
  r.a1 = r.L - r.L1 / 2; r.a2 = r.L - r.L1 - r.L2 / 2; r.a3 = r.L - r.L1 - r.L2 - r.L3 / 2;
  r.P1 = r.w1 * r.L1; r.P2 = r.w2 * r.L2; r.P3 = r.w1 * r.L3;
  r.Ay = (r.P1 * r.a1 + r.P2 * r.a2 + r.P3 * r.a3) / r.L;      // AT20
  r.By = (r.P1 + r.P2 + r.P3) - r.Ay;                          // AT21
  r.V1 = -r.Ay;
  r.V2 = r.V1 + r.w1 * r.L1;
  r.V2p = r.V2 * i.X2 / r.L2;
  r.V3 = r.By - r.w1 * r.L3;
  r.V3p = r.V3 * i.X2 / r.L2;
  r.V4 = r.By;
  r.N1 = r.V2p * r.H / i.X2; r.N2 = r.V3p * r.H / i.X2;
  r.x = -r.N1 * r.L2 / (-r.N1 + r.N2); r.Lx = r.L2 - r.x;
  r.M1 = -(r.V2 + r.V1) * r.L1 / 2;
  r.M2 = (r.V3 + r.By) * r.L3 / 2;
  r.Mmax = r.M1 + r.V2p / 2 * (r.V2p * r.L2 / (-r.V2p + r.V3p)); // AT35
  // Section B-B (landing spanning across Y1+Y2+Y3)
  r.Bl = Math.max(i.X1, i.X3);
  r.Gb = r.Bl * (i.t + 0.05) * 25 + (i.t + i.N * r.run * r.rise) * r.B * 25 / 4; // BR9
  r.wb = i.Gf * r.Gb + i.Qf * i.Q;                                                  // BR15
  r.Lb = i.Y1 + i.Y2 + i.Y3;
  r.Ayb = r.wb * r.Lb / 2; r.Byb = r.Ayb;
  r.Mb = r.wb * r.Lb * r.Lb / 8;                                                    // simply supported (fix: sheet BR25 gave wL²/4)
  return r;
}

// Bar marks and lengths (sheet CK26:CL35, CP26), cm
function stairLengths(i, r){
  var cc = i.cc / 1000;
  return {
    L1: xlRoundUp(i.X1 * 1.25 + (i.t - 2 * cc), 2) * 100,
    L2: xlRoundUp(i.X1 + i.X3 * 0.25 + r.L2, 2) * 100,
    L3: xlRoundUp(i.X3 * 1.25 + (i.t - 2 * cc), 2) * 100,
    L4: xlRoundUp(i.X3 * 1.25, 2) * 100,
    L5: xlRoundUp(r.B + 2 * i.t - 4 * cc, 2) * 100,
    L6: xlRoundUp(i.Y1 + i.Y2 + i.Y3 + 2 * i.t - 4 * cc, 2) * 100
  };
}

function stairBsDesign(M, bm, i){
  var o = {b: bm * 1000, d: i.t * 1000 - i.cc};
  o.K = M * 1e6 / (o.b * o.d * o.d * i.fc);
  o.Kok = o.K <= 0.156;                                        // above 0.156 compression steel is needed
  o.z0 = 0.5 + Math.sqrt(Math.max(0, 0.25 - o.K / 0.9));
  o.z = Math.min(o.z0, 0.95);                                  // lever arm ratio z/d, capped at 0.95
  o.Ascalc = M * 1e6 / (0.87 * i.fy * o.z * o.d);              // fix: sheet omitted z
  o.Asmin = 0.0013 * i.t * o.b * 1000;
  o.As = Math.max(o.Ascalc, o.Asmin);
  return o;
}

function stairAciDesign(M, V, bm, i, db){
  var o = {b: bm * 1000, h: i.t * 1000};
  o.d = o.h - i.cc - db / 2;
  var A = 0.85 * i.fc * 0.9 * o.b / 2, Bq = -0.85 * 0.9 * i.fc * o.b * o.d, C = M * 1e6;
  var disc = Bq * Bq - 4 * A * C;
  o.fail = disc < 0;
  o.a = o.fail ? NaN : (-Bq - Math.sqrt(disc)) / (2 * A);
  o.Ascalc = 0.85 * i.fc * o.a * o.b / i.fy;
  o.Asmin = 0.0018 * o.b * o.h;
  o.As = Math.max(o.Ascalc, o.Asmin);
  o.b1 = b1sheet(i.fc);
  o.c = o.a / o.b1;
  o.cmax = 0.375 * o.d;
  o.tc = !o.fail && o.c <= o.cmax;
  o.phiVc = 0.75 * 0.17 * Math.sqrt(i.fc) * o.b * o.d / 1000;
  o.V = V; o.Vok = V <= o.phiVc;
  o.smax = Math.min(3 * o.h, 450);
  return o;
}

// bars across a width wm (m) for a required As: BS = sheet rule, ACI = enough bars + max spacing
function stairBars(As, db, wm, code, smaxmm){
  var A = Math.PI * db * db / 4, n, s;
  if (code === "BS") {
    n = Math.max(1, Math.ceil(As / A - 1e-9));                 // fix: round up so As,prov >= As,req
    s = xlRoundDown(wm * 100 / n, 0);
  } else {
    n = Math.ceil(As / A - 1e-9);
    s = xlRoundDown(wm * 100 / n, 0);
    if (s * 10 > smaxmm) { s = Math.floor(smaxmm / 10); n = Math.ceil(wm * 100 / s - 1e-9); }
  }
  return {A: A, n: n, s: s, prov: n * A};
}

  var L = segs.reduce(function(a, s){ return a + s.L; }, 0), wmax = Math.max.apply(null, segs.map(function(s){ return s.w; }));
  var x = x0;
  segs.forEach(function(s){
    var wpx = s.L / L * Lpx, h = 10 + 26 * s.w / Math.max(wmax, 1e-9), top = yB - 4 - h, k, n = Math.max(2, Math.round(wpx / 14));
    shapes.push({t: "rect", x: x, y: top, w: wpx, h: h, fill: [0.99, 0.93, 0.88], stroke: FIG_C.acc, sw: 0.8});
    for (k = 0; k <= n; k++) arrowDown(shapes, x + 3 + (wpx - 6) * k / n, top, yB - 4, FIG_C.acc);
    shapes.push({t: "text", x: x + wpx / 2, y: top - 5, s: s.label + " = " + fmt(s.w, 2) + " kN/m", size: 8, fill: FIG_C.acc});
    if (segs.length > 1) shapes = shapes.concat(dimShapes(x, yB + 40, x + wpx, yB + 40, s.dim || fmt(s.L, 3) + " m"));
    x += wpx;
  });
  shapes.push({t: "line", x1: x0, y1: yB, x2: x0 + Lpx, y2: yB, stroke: FIG_C.pri, sw: 3});
  [x0, x0 + Lpx].forEach(function(sx, j){
    shapes.push({t: "line", x1: sx, y1: yB, x2: sx - 6, y2: yB + 9, stroke: FIG_C.pri, sw: 1.2});
    shapes.push({t: "line", x1: sx, y1: yB, x2: sx + 6, y2: yB + 9, stroke: FIG_C.pri, sw: 1.2});
    arrowUp(shapes, sx, yB + 26, yB + 11, FIG_C.ok);
    shapes.push({t: "text", x: sx + (j ? -6 : 6), y: yB + 27, s: (j ? "By = " : "Ay = ") + fmt(j ? RB : RA, 2) + " kN", size: 8.5, fill: FIG_C.ok, anchor: j ? "end" : "start"});
  });
  var yL = yB + (segs.length > 1 ? 62 : 44);
  shapes = shapes.concat(dimShapes(x0, yL, x0 + Lpx, yL, lenLabel));
  shapes.push({t: "text", x: W / 2, y: 12, s: title, size: 10.5, fill: FIG_C.pri, bold: true});
  return {w: W, h: yL + 20, shapes: shapes};
}
// diagram from sample points [[s, v], ...]; positive values drawn below the axis (moment) or above (shear)
function figDiagram(pts, L, title, unit, labels, down, opt){
  opt = opt || {};
  var shapes = [], W = 300, x0 = 30, Lpx = 240, y0 = 76, A = 40;
  var vmax = Math.max.apply(null, pts.map(function(p){ return Math.abs(p[1]); })) || 1;
  var X = function(s){ return x0 + s / L * Lpx; }, Y = function(v){ return y0 + (down ? 1 : -1) * v / vmax * A; };
  shapes.push({t: "line", x1: x0, y1: y0, x2: x0 + Lpx, y2: y0, stroke: FIG_C.mut, sw: 1});
  // hatch: vertical ordinates every ~8 px
  for (var q = 1; q < pts.length; q++) {
    var xa = X(pts[q - 1][0]), xb = X(pts[q][0]), m = Math.floor((xb - xa) / 8);
    for (var j = 1; j < m; j++) {
      var t = j / m, v = pts[q - 1][1] + (pts[q][1] - pts[q - 1][1]) * t;
      shapes.push({t: "line", x1: xa + (xb - xa) * t, y1: y0, x2: xa + (xb - xa) * t, y2: Y(v), stroke: FIG_C.pri, sw: 0.35});
    }
  }
  for (var k = 1; k < pts.length; k++)
    shapes.push({t: "line", x1: X(pts[k - 1][0]), y1: Y(pts[k - 1][1]), x2: X(pts[k][0]), y2: Y(pts[k][1]), stroke: FIG_C.pri, sw: 1.5});
  labels.forEach(function(lb){
    var below = (down ? 1 : -1) * lb[1] >= 0, an = lb[3] || "middle";
    var dx = an === "start" ? 3 : an === "end" ? -3 : 0;
    shapes.push({t: "text", x: X(lb[0]) + dx, y: Y(lb[1]) + (below ? 12 : -5), s: lb[2], size: 8.5, fill: FIG_C.txt, anchor: an, bold: !!lb[4]});
  });
  var yDim = y0 + A + 18;
  (opt.marks || []).forEach(function(mk){
    shapes.push({t: "line", x1: X(mk[0]), y1: y0 - A - 4, x2: X(mk[0]), y2: y0, stroke: FIG_C.acc, sw: 0.8, dash: "3 2"});
    shapes.push({t: "text", x: X(mk[0]) + 3, y: y0 - A - 2, s: mk[1], size: 8, fill: FIG_C.acc, anchor: "start"});
  });
  if (opt.segs) {
    var s0 = 0;
    opt.segs.forEach(function(sg){ shapes = shapes.concat(dimShapes(X(s0), yDim, X(s0 + sg), yDim, fmt(sg, 3) + " m")); s0 += sg; });
    yDim += 16;
  }
  shapes.push({t: "text", x: W / 2, y: 12, s: title + " (" + unit + ")", size: 10.5, fill: FIG_C.pri, bold: true});
  return {w: W, h: yDim + 10, shapes: shapes};
}
function parab3(p0, p1, p2, n){ // quadratic through 3 points, sampled
  var out = [], k, s, a = p0[0], b = p1[0], c = p2[0];
  for (k = 0; k <= n; k++) {
    s = a + (c - a) * k / n;
    out.push([s, p0[1] * (s - b) * (s - c) / ((a - b) * (a - c)) + p1[1] * (s - a) * (s - c) / ((b - a) * (b - c)) + p2[1] * (s - a) * (s - b) / ((c - a) * (c - b))]);
  }
  return out;
}
function stairMoments(r){
  var pts = [], k, s, n = 12;
  for (k = 0; k <= n; k++) { s = r.L1 * k / n; pts.push([s, r.Ay * s - r.w1 * s * s / 2]); }
  var xm = Math.min(Math.max(r.x, 0.02 * r.L2), 0.98 * r.L2);
  pts = pts.concat(parab3([r.L1, r.M1], [r.L1 + xm, r.Mmax], [r.L1 + r.L2, r.M2], 16).slice(1));
  for (k = 1; k <= n; k++) { s = r.L3 * (1 - k / n); pts.push([r.L - s, r.By * s - r.w1 * s * s / 2]); }
  return pts;
}
function figStairReinf(i, r, b1, b5, b6){
  // only the steel this tool designs: main bottom bars (Mmax) ② and ④, distribution ⑤, landing B-B ⑥
  var f = figStair(i, r), c = FIG_C.acc, dy = 30;
  var sh = f.shapes.filter(function(s){ return !(s.t === "text" && (/^Section A-A/.test(s.s) || / risers|^G = /.test(s.s))); });
  sh.forEach(function(s){ if (s.y != null) s.y += dy; if (s.y1 != null) { s.y1 += dy; s.y2 += dy; } });
  var x0 = 22, sc = 250 / Math.max(i.X1 + i.X2 + i.X3, 0.1);
  var Hm = Math.max(i.Ht - i.Hb, 0), Hpx = Math.min(Hm * sc, 110), yL = 26 + Hpx + 10 + dy, yH = yL - Hpx, tpx = Math.max(5, i.t * sc);
  var xa = x0, xb = xa + i.X1 * sc, xc = xb + i.X2 * sc, xd = xc + i.X3 * sc, o = 2.2;
  var slope = (yL - yH) / Math.max(xc - xb, 1e-9);
  var Ls = function(x1, y1, x2, y2){ sh.push({t: "line", x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, sw: 1.8}); };
  var yb1 = yL + tpx - o, yb2 = yH + tpx - o;
  // ② bottom of lower landing + waist, 0.25 X3 into the upper landing
  Ls(xa + 3, yb1, xb, yb1); Ls(xb, yb1, xc, yb2); Ls(xc, yb2, xc + 0.25 * (xd - xc), yb2);
  // ④ bottom of upper landing, extended 0.25 X3 into the waist (crosses ② at the corner)
  var e4 = 0.25 * (xd - xc), y4 = yb2 - 2.2;
  Ls(xd - 3, y4, xc, y4); Ls(xc, y4, xc - e4, y4 + e4 * slope);
  // ⑤ distribution bars (dots) along the waist
  for (var k = 1; k < 8; k++) { var xx = xb + (xc - xb) * k / 8; sh.push({t: "circle", x: xx, y: yb1 - (xx - xb) * slope - 2.6, r: 1.4, fill: c, stroke: c}); }

  lead(sh, (xc + xd) / 2 + 8, y4, (xc + xd) / 2 + 8, yH - 18, "④ " + main, c, "middle");
  var x5 = xb + (xc - xb) * 3 / 8;
  lead(sh, x5, yb1 - (x5 - xb) * slope - 2.6, x5 - 34, yb1 - (x5 - xb) * slope - 30, "⑤ T" + i.d5 + "/" + b5.s + " cm", c, "end");
  sh.push({t: "text", x: 150, y: 14, s: "Reinforcement - section A-A", size: 10.5, fill: FIG_C.pri, bold: true});
  var yN = f.h + dy + 4;
  sh.push({t: "text", x: 150, y: yN, s: "⑥ landing B-B (bottom, across the stair): " + b6.n + "T" + i.d6 + "/" + b6.s + " cm", size: 9, fill: c, bold: true});

  ws += figHtml(figDiagram([[0, -r.V1], [r.L1, -r.V2], [r.L1, -r.V2p], [r.L1 + r.L2, -r.V3p], [r.L1 + r.L2, -r.V3], [r.L, -r.V4]], r.L, "Shear force diagram A-A", "kN",
    [[0, -r.V1, fmt(-r.V1, 1), "start"], [r.L1, -r.V2p, fmt(-r.V2p, 1), "start"], [r.L1 + r.L2, -r.V3p, fmt(-r.V3p, 1), "end"], [r.L, -r.V4, fmt(-r.V4, 1), "end"]], false,
    {marks: [[r.L1 + r.x, "V = 0 at x = " + fmt(r.x, 3) + " m"]], segs: [r.L1, r.L2, r.L3]}), "SFD (V′ on the flight; + = upward shear at the left)");
  ws += st("Point of zero shear on the flight:");
  ws += E3("x = " + fr("−N" + S("1") + " × L" + S("2"), "N" + S("2") + " − N" + S("1")), "x = " + fr("−(" + fmt(r.N1, 3) + ") × " + fmt(r.L2, 3), fmt(r.N2, 3) + " − (" + fmt(r.N1, 3) + ")"), "x = " + fmt(r.x, 3) + " m  (from the start of the flight)");
  ws += st("Moments (area of the shear diagram):");
  ws += E3("M" + S("1") + " = " + fr("−(V" + S("1") + " + V" + S("2") + ") × L" + S("1"), "2"), "M" + S("1") + " = " + fr("−(" + fmt(r.V1, 3) + " + " + fmt(r.V2, 3) + ") × " + fmt(r.L1, 3), "2"), "M" + S("1") + " = " + fmt(r.M1, 3) + " kN.m");
  ws += E3("M" + S("2") + " = " + fr("(V" + S("3") + " + V" + S("4") + ") × L" + S("3"), "2"), "M" + S("2") + " = " + fr("(" + fmt(r.V3, 3) + " + " + fmt(r.V4, 3) + ") × " + fmt(r.L3, 3), "2"), "M" + S("2") + " = " + fmt(r.M2, 3) + " kN.m");
  ws += E3("M" + S("max") + " = M" + S("1") + " + " + fr("V" + S("2") + "′", "2") + " × " + fr("V" + S("2") + "′ × L" + S("2"), "V" + S("3") + "′ − V" + S("2") + "′"),
           "M" + S("max") + " = " + fmt(r.M1, 3) + " + " + fr(fmt(r.V2p, 3), "2") + " × " + fr(fmt(r.V2p, 3) + " × " + fmt(r.L2, 3), fmt(r.V3p, 3) + " − (" + fmt(r.V2p, 3) + ")"),
           "M" + S("max") + " = " + fmt(r.Mmax, 3) + " kN.m");
  ws += figHtml(figDiagram(stairMoments(r), r.L, "Bending moment diagram A-A", "kN.m",
    [[r.L1, r.M1, fmt(r.M1, 1), "end"], [r.L1 + r.x, r.Mmax, "Mmax = " + fmt(r.Mmax, 1), "middle", 1], [r.L1 + r.L2, r.M2, fmt(r.M2, 1), "start"]], true,
    {marks: [[r.L1 + r.x, "Mmax at x = " + fmt(r.x, 3) + " m"]], segs: [r.L1, r.L2, r.L3]}), "BMD (sagging drawn below the axis)");

  ws += "<div class='step-head'>4. Analysis B-B (landing spanning across the stair)</div>";
  ws += E3("B" + S("L") + " = max(X" + S("1") + ", X" + S("3") + ")", "B" + S("L") + " = max(" + fmt(i.X1, 3) + ", " + fmt(i.X3, 3) + ")", "B" + S("L") + " = " + fmt(r.Bl, 3) + " m");
  ws += E3("G = B" + S("L") + " (t + 0.05) γ" + S("c") + " + " + fr("(t + N × Run × Rise) × B × γ" + S("c"), "4"),
           "G = " + fmt(r.Bl, 3) + " × (" + fmt(i.t, 3) + " + 0.05) × 25 + " + fr("(" + fmt(i.t, 3) + " + " + fmt(i.N, 0) + " × " + fmt(r.run, 4) + " × " + fmt(r.rise, 4) + ") × " + fmt(r.B, 3) + " × 25", "4"),
           "G = " + fmt(r.Gb, 3) + " kN/m");
  ws += E3("w = γ" + S("G") + " G + γ" + S("Q") + " Q", "w = " + fmt(i.Gf, 2) + " × " + fmt(r.Gb, 3) + " + " + fmt(i.Qf, 2) + " × " + fmt(i.Q, 2), "w = " + fmt(r.wb, 3) + " kN/m");
  ws += E3("L" + S("B") + " = Y" + S("1") + " + Y" + S("2") + " + Y" + S("3"), "L" + S("B") + " = " + fmt(i.Y1, 3) + " + " + fmt(i.Y2, 3) + " + " + fmt(i.Y3, 3), "L" + S("B") + " = " + fmt(r.Lb, 3) + " m");
  ws += figHtml(figBeamLoads([{L: r.Lb, w: r.wb, label: "w"}], r.Ayb, r.Byb, "Loading B-B", "LB = " + fmt(r.Lb, 3) + " m"), "Landing B-B as a simply supported beam");
  ws += E3("A" + S("y") + " = B" + S("y") + " = " + fr("w L" + S("B"), "2"), "A" + S("y") + " = " + fr(fmt(r.wb, 3) + " × " + fmt(r.Lb, 3), "2"), "A" + S("y") + " = B" + S("y") + " = " + fmt(r.Ayb, 3) + " kN");
  ws += E3("M" + S("max") + " = " + fr("w L" + S("B") + "²", "8"), "M" + S("max") + " = " + fr(fmt(r.wb, 3) + " × " + fmt(r.Lb, 3) + "²", "8"), "M" + S("max") + " = " + fmt(r.Mb, 3) + " kN.m");

  function bsBlock(title, M, d, bars, db, mark){
    var s = "<div class='step-head'>" + title + "</div>";
    s += E3("b = width × 1000", "", "b = " + fmt(d.b, 0) + " mm");
    s += E3("d = t − c" + S("c"), "d = " + fmt(i.t * 1000, 0) + " − " + fmt(i.cc, 0), "d = " + fmt(d.d, 0) + " mm");
    s += E3("K = " + fr("M", "b d² f" + S("cu")), "K = " + fr(fmt(M, 3) + " × 10⁶", fmt(d.b, 0) + " × " + fmt(d.d, 0) + "² × " + fmt(i.fc, 0)), "K = " + fmt(d.K, 4) + "  ≤ K′ = 0.156 → " + okbad(d.Kok, "Ok", "No — compression steel needed, increase thickness"));
    s += st("Lever arm (BS 8110 cl. 3.4.4.4):");
    s += E3("z = d × " + "[0.5 + " + rad("0.25 − " + fr("K", "0.9")) + "]  ≤ 0.95 d",
            "z = " + fmt(d.d, 0) + " × [0.5 + " + rad("0.25 − " + fr(fmt(d.K, 4), "0.9")) + "] = " + fmt(d.z0 * d.d, 1) + " mm ;  0.95 d = 0.95 × " + fmt(d.d, 0) + " = " + fmt(0.95 * d.d, 1) + " mm",
            "z = " + fmt(d.z * d.d, 1) + " mm");
    s += E3("A" + S("s,req") + " = " + fr("M", "0.87 f" + S("y") + " z"), "A" + S("s,req") + " = " + fr(fmt(M, 3) + " × 10⁶", "0.87 × " + fmt(i.fy, 0) + " × " + fmt(d.z * d.d, 1)), "A" + S("s,req") + " = " + fmt(d.Ascalc, 1) + " mm²");
    s += E3("A" + S("s,min") + " = 0.0013 b h", "A" + S("s,min") + " = 0.0013 × " + fmt(d.b, 0) + " × " + fmt(i.t * 1000, 0), "A" + S("s,min") + " = " + fmt(d.Asmin, 1) + " mm²");
    s += E3("A" + S("s") + " = max(A" + S("s,req") + ", A" + S("s,min") + ")", "", "A" + S("s") + " = " + fmt(d.As, 1) + " mm²");
    s += E3("A" + S("bar") + " = " + fr("π d" + S("b") + "²", "4"), "A" + S("bar") + " = " + fr("π × " + db + "²", "4"), "A" + S("bar") + " = " + fmt(bars.A, 2) + " mm²");
    s += E3("n = ⌈" + fr("A" + S("s"), "A" + S("bar")) + "⌉", "n = ⌈" + fr(fmt(d.As, 1), fmt(bars.A, 2)) + "⌉", "n = " + bars.n + " bars");
    s += E3("s = ⌊" + fr("width × 100", "n") + "⌋", "s = ⌊" + fr(fmt(d.b / 10, 0), String(bars.n)) + "⌋", "s = " + bars.s + " cm");
    s += E3("A" + S("s,prov") + " = n × A" + S("bar"), "A" + S("s,prov") + " = " + bars.n + " × " + fmt(bars.A, 2), "A" + S("s,prov") + " = " + fmt(bars.prov, 0) + " mm² ≥ " + fmt(d.As, 0) + " mm² → " + mark + " " + bars.n + "T" + db + "/" + bars.s + " cm");
    return s;
  }
  function aciBlock(title, M, d, bars, db, mark){
    var s = "<div class='step-head'>" + title + "</div>";
    s += E3("b = width × 1000", "", "b = " + fmt(d.b, 0) + " mm");
    s += E3("d = h − cover − " + fr("d" + S("b"), "2"), "d = " + fmt(d.h, 0) + " − " + fmt(i.cc, 0) + " − " + fr(String(db), "2"), "d = " + fmt(d.d, 1) + " mm");
    if (d.fail) return s + eqr("<span class='bad'>Section cannot carry the moment — increase thickness.</span>");
    s += E3("a = d − " + rad("d² − " + fr("2 M" + S("u"), "0.85 φ f′" + S("c") + " b")),
            "a = " + fmt(d.d, 1) + " − " + rad(fmt(d.d, 1) + "² − " + fr("2 × " + fmt(M, 3) + " × 10⁶", "0.85 × 0.9 × " + fmt(i.fc, 1) + " × " + fmt(d.b, 0))),
            "a = " + fmt(d.a, 2) + " mm");
    s += E3("A" + S("s,req") + " = " + fr("0.85 f′" + S("c") + " a b", "f" + S("y")), "A" + S("s,req") + " = " + fr("0.85 × " + fmt(i.fc, 1) + " × " + fmt(d.a, 2) + " × " + fmt(d.b, 0), fmt(i.fy, 0)), "A" + S("s,req") + " = " + fmt(d.Ascalc, 1) + " mm²");
    s += E3("A" + S("s,min") + " = 0.0018 b h  (ACI 7.6.1.1)", "A" + S("s,min") + " = 0.0018 × " + fmt(d.b, 0) + " × " + fmt(d.h, 0), "A" + S("s,min") + " = " + fmt(d.Asmin, 1) + " mm²");
    s += E3("A" + S("s") + " = max(A" + S("s,req") + ", A" + S("s,min") + ")", "", "A" + S("s") + " = " + fmt(d.As, 1) + " mm²");
    s += E3("c = " + fr("a", "β" + S("1")) + "  ≤ 0.375 d (tension-controlled, φ = 0.90)", "c = " + fr(fmt(d.a, 2), fmt(d.b1, 3)) + " ;  0.375 × " + fmt(d.d, 1) + " = " + fmt(d.cmax, 1) + " mm", "c = " + fmt(d.c, 2) + " mm → " + okbad(d.tc, "tension-controlled", "not tension-controlled"));
    s += E3("φV" + S("c") + " = 0.75 × 0.17 λ " + rad("f′" + S("c")) + " b d  (ACI 22.5.5.1)", "φV" + S("c") + " = " + fr("0.75 × 0.17 × 1.0 × " + rad(fmt(i.fc, 1)) + " × " + fmt(d.b, 0) + " × " + fmt(d.d, 1), "1000"), "φV" + S("c") + " = " + fmt(d.phiVc, 2) + " kN ≥ V" + S("u") + " = " + fmt(d.V, 2) + " kN → " + okbad(d.Vok, "Ok", "Increase thickness"));
    s += E3("A" + S("bar") + " = " + fr("π d" + S("b") + "²", "4"), "A" + S("bar") + " = " + fr("π × " + db + "²", "4"), "A" + S("bar") + " = " + fmt(bars.A, 2) + " mm²");
    s += E3("n = ⌈" + fr("A" + S("s"), "A" + S("bar")) + "⌉", "n = ⌈" + fr(fmt(d.As, 1), fmt(bars.A, 2)) + "⌉", "n = " + bars.n + " bars");
    s += E3("s ≤ min(3h, 450 mm)  (ACI 7.7.2.3)", "s" + S("max") + " = min(3 × " + fmt(d.h, 0) + ", 450)", "s = " + bars.s + " cm ≤ " + fmt(d.smax / 10, 1) + " cm");
    s += E3("A" + S("s,prov") + " = n × A" + S("bar"), "A" + S("s,prov") + " = " + bars.n + " × " + fmt(bars.A, 2), "A" + S("s,prov") + " = " + fmt(bars.prov, 0) + " mm² ≥ " + fmt(d.As, 0) + " mm² → " + mark + " " + bars.n + "T" + db + "/" + bars.s + " cm");
    return s;
  }
  if (bs) {
    ws += bsBlock("5. Design A-A (BS 8110), width B = " + fmt(r.B, 2) + " m", r.Mmax, dA, b1, i.d1, "①②③④");
    ws += "<div class='step-head'>6. Distribution steel ⑤</div>";
    ws += E3("A" + S("s,dist") + " = " + fr("A" + S("s"), "5"), "A" + S("s,dist") + " = " + fr(fmt(dA.As, 1), "5"), "A" + S("s,dist") + " = " + fmt(b5.As, 1) + " mm²");
    ws += E3("n = ⌈" + fr("A" + S("s,dist"), "A" + S("bar")) + "⌉", "n = ⌈" + fr(fmt(b5.As, 1), fmt(b5.A, 2)) + "⌉", "n = " + b5.n + " bars/m");
    ws += E3("s = ⌊" + fr("100", "n") + "⌋", "s = ⌊" + fr("100", String(b5.n)) + "⌋", "s = " + b5.s + " cm");
    ws += E3("Number along flight = ⌈n × L" + S("2") + "⌉", "⌈" + b5.n + " × " + fmt(r.L2, 3) + "⌉", "⑤ " + b5.cnt + "T" + i.d5 + "/" + b5.s + " cm");
    ws += bsBlock("7. Design B-B (BS 8110), width B" + S("L") + " = " + fmt(r.Bl, 2) + " m", r.Mb, dB, b6, i.d6, "⑥");
  } else {
    ws += aciBlock("5. Design A-A (ACI 318M-19), width B = " + fmt(r.B, 2) + " m", r.Mmax, dA, b1, i.d1, "①②③④");
    ws += "<div class='step-head'>6. Distribution / shrinkage steel ⑤</div>";
    ws += E3("A" + S("s,sh") + " = 0.0018 × 1000 × h", "A" + S("s,sh") + " = 0.0018 × 1000 × " + fmt(i.t * 1000, 0), "A" + S("s,sh") + " = " + fmt(b5.As, 1) + " mm²/m");
    ws += E3("n = ⌈" + fr("A" + S("s,sh"), "A" + S("bar")) + "⌉", "n = ⌈" + fr(fmt(b5.As, 1), fmt(b5.A, 2)) + "⌉", "n = " + b5.n0 + " bars/m");
    ws += E3("s = min(⌊" + fr("100", "n") + "⌋, 5h, 45 cm)", "s = min(⌊" + fr("100", String(b5.n0)) + "⌋, " + fmt(b5.smax / 10, 1) + ", 45)", "s = " + b5.s + " cm");
    ws += E3("Number along flight = ⌈" + fr("L" + S("2") + " × 100", "s") + "⌉", "⌈" + fr(fmt(r.L2 * 100, 1), String(b5.s)) + "⌉", "⑤ " + b5.cnt + "T" + i.d5 + "/" + b5.s + " cm");
    ws += aciBlock("7. Design B-B (ACI 318M-19), width B" + S("L") + " = " + fmt(r.Bl, 2) + " m", r.Mb, dB, b6, i.d6, "⑥");
  }
  ws += "<div class='step-head'>8. Bar lengths</div>";
  var cc = i.cc / 1000;
  ws += E3("L① = ⌈1.25 X" + S("1") + " + t − 2c" + S("c") + "⌉", "L① = 1.25 × " + fmt(i.X1, 3) + " + " + fmt(i.t, 3) + " − 2 × " + fmt(cc, 3), "L① = " + fmt(Lg.L1, 0) + " cm");
  ws += E3("L② = ⌈X" + S("1") + " + 0.25 X" + S("3") + " + L" + S("2") + "⌉", "L② = " + fmt(i.X1, 3) + " + 0.25 × " + fmt(i.X3, 3) + " + " + fmt(r.L2, 3), "L② = " + fmt(Lg.L2, 0) + " cm");
  ws += E3("L③ = ⌈1.25 X" + S("3") + " + t − 2c" + S("c") + "⌉", "L③ = 1.25 × " + fmt(i.X3, 3) + " + " + fmt(i.t, 3) + " − 2 × " + fmt(cc, 3), "L③ = " + fmt(Lg.L3, 0) + " cm");
  ws += E3("L④ = ⌈1.25 X" + S("3") + "⌉", "L④ = 1.25 × " + fmt(i.X3, 3), "L④ = " + fmt(Lg.L4, 0) + " cm");
  ws += E3("L⑤ = ⌈B + 2t − 4c" + S("c") + "⌉", "L⑤ = " + fmt(r.B, 3) + " + 2 × " + fmt(i.t, 3) + " − 4 × " + fmt(cc, 3), "L⑤ = " + fmt(Lg.L5, 0) + " cm");
  ws += E3("L⑥ = ⌈Y" + S("1") + " + Y" + S("2") + " + Y" + S("3") + " + 2t − 4c" + S("c") + "⌉", "L⑥ = " + fmt(i.Y1, 3) + " + " + fmt(i.Y2, 3) + " + " + fmt(i.Y3, 3) + " + 2 × " + fmt(i.t, 3) + " − 4 × " + fmt(cc, 3), "L⑥ = " + fmt(Lg.L6, 0) + " cm");
  ws += "<div class='step-head'>9. Reinforcement</div>";
  ws += figHtml(figStairReinf(i, r, b1, b5, b6), "Reinforcement arrangement (schematic)");
  ws += schedHtml;
  return out + ws;
}

// ---------- Excel export (live formulas) ----------
function stairXlsx(code, v){
  var bs = code === "BS", rows = [], addr = {}, merges = [];
  function R(){ return rows.length + 1; }
  function title(t){ rows.push([{v: t, s: 1}]); }
  function head(t){ rows.push([{v: t, s: 2}, {v: "", s: 2}, {v: "", s: 2}, {v: "", s: 2}]); }
  function inp(k, label, unit){ addr[k] = "B" + R(); rows.push([label, {v: v[k], s: 3}, unit || "", ""]); }
  function sub(f){ return f.replace(/\{(\w+)\}/g, function(_, k){ if (!addr[k]) throw new Error("no cell for " + k); return addr[k]; }); }
  function calc(k, label, f, unit, note){ addr[k] = "B" + R(); rows.push([label, {f: sub(f), s: 6}, unit || "", {v: note || f.replace(/[{}]/g, ""), s: 5}]); }
  function res(k, label, f, unit, note){ addr[k] = "B" + R(); rows.push([{v: label, s: 8}, {f: sub(f), s: 4}, unit || "", {v: note || "", s: 5}]); }
  function txt(k, label, f){ addr[k] = "B" + R(); rows.push([label, {f: sub(f), v: "", s: 8}, "", ""]); }
  title("Staircase Design - " + (bs ? "BS 8110" : "ACI 318M-19"));
  rows.push([{v: "Yellow cells are inputs: change them and every result below recalculates. Generated " + new Date().toLocaleString("en-GB"), s: 5}]);
  rows.push([]);
  head("INPUTS");
  inp("N", "Number of risers N", ""); inp("t", "Slab thickness t", "m");
  inp("Y1", "Y1 (flight 1 width)", "m"); inp("Y2", "Y2 (gap)", "m"); inp("Y3", "Y3 (flight 2 width)", "m");
  inp("X1", "X1 (landing 1)", "m"); inp("X2", "X2 (going, plan)", "m"); inp("X3", "X3 (landing 2)", "m");
  inp("Ht", "Top elevation", "m"); inp("Hb", "Bottom elevation", "m");
  inp("fc", bs ? "fcu (f'c used)" : "f'c", "MPa"); inp("fy", "fy", "MPa"); inp("cc", bs ? "Cover cc (d = t - cc)" : "Clear cover", "mm");
  inp("Q", "Live load Q", "kN/m"); inp("Gf", "Dead load factor", ""); inp("Qf", "Live load factor", "");
  inp("d1", "Bars 1-4 diameter", "mm"); inp("d5", "Bar 5 diameter (distribution)", "mm"); inp("d6", "Bar 6 diameter (B-B)", "mm");
  rows.push([]);
  head("1. GEOMETRY");
  calc("H", "H = Top - Bottom", "={Ht}-{Hb}", "m");
  calc("run", "Run = X2 / N", "={X2}/{N}", "m");
  calc("rise", "Rise = H / N", "={H}/{N}", "m");
  calc("L1", "L1 = X1", "={X1}", "m"); calc("L2", "L2 = sqrt(X2² + H²)", "=SQRT({X2}^2+{H}^2)", "m"); calc("L3", "L3 = X3", "={X3}", "m");
  calc("L", "L = L1 + L2 + L3", "={L1}+{L2}+{L3}", "m"); calc("B", "B = max(Y1, Y3)", "=MAX({Y1},{Y3})", "m");
  head("2. LOADS A-A");
  calc("G1", "G1 = Y1 (t + 0.05) x 25", "={Y1}*({t}+0.05)*25", "kN/m");
  calc("G2", "G2 = (t + N Run Rise) B x 25 / 2", "=({t}+{N}*{run}*{rise})*{B}*25/2", "kN/m");
  calc("w1", "w1 = Gf G1 + Qf Q", "={Gf}*{G1}+{Qf}*{Q}", "kN/m"); calc("w2", "w2 = Gf G2 + Qf Q", "={Gf}*{G2}+{Qf}*{Q}", "kN/m");
  head("3. ANALYSIS A-A");
  calc("P1", "P1 = w1 L1", "={w1}*{L1}", "kN"); calc("P2", "P2 = w2 L2", "={w2}*{L2}", "kN"); calc("P3", "P3 = w1 L3", "={w1}*{L3}", "kN");
  calc("a1", "a1 = L - L1/2", "={L}-{L1}/2", "m"); calc("a2", "a2 = L - L1 - L2/2", "={L}-{L1}-{L2}/2", "m"); calc("a3", "a3 = L3/2", "={L3}/2", "m");

  var x0 = 105, y0 = 18;
  var sc = Math.min(120 / o.b, 120 / o.h);
  var bw = o.b * sc, hh = o.h * sc;
  var ins = Math.max(4, (o.cov || 25) * sc);
  shapes.push({t: "rect", x: x0, y: y0, w: bw, h: hh, fill: FIG_C.conc, stroke: FIG_C.pri, sw: 2});
  shapes.push({t: "rect", x: x0 + ins, y: y0 + ins, w: bw - 2 * ins, h: hh - 2 * ins, stroke: FIG_C.acc, sw: 1.6});
  shapes.push({t: "line", x1: x0 + ins + 1, y1: y0 + ins + 1, x2: x0 + ins + 8, y2: y0 + ins + 8, stroke: FIG_C.acc, sw: 1.6});
  shapes.push({t: "line", x1: x0 + ins + 6, y1: y0 + ins + 1, x2: x0 + ins + 13, y2: y0 + ins + 8, stroke: FIG_C.acc, sw: 1.6});
  var n = Math.max(0, Math.min(24, o.nBars || 0)), k;
  if (n) {
    var rB = Math.max(2, (o.dbBar || 12) * sc / 2), xL = x0 + ins + rB, xR = x0 + bw - ins - rB, yT = y0 + ins + rB, yBo = y0 + hh - ins - rB;
    var pts = [[xL, yT], [xR, yT], [xL, yBo], [xR, yBo]].slice(0, Math.min(4, n)), rest = Math.max(0, n - 4);
    // remaining bars: half on each side face (long faces of the section)
    // side bars: the same number on the left and right faces; an odd one goes to the middle of the bottom face
    var nS = Math.floor(rest / 2);
    for (k = 1; k <= nS; k++) { var t = k / (nS + 1); pts.push([xL, yT + (yBo - yT) * t]); pts.push([xR, yT + (yBo - yT) * t]); }
    if (rest % 2) pts.push([(xL + xR) / 2, yBo]);
    pts.forEach(function(q){ shapes.push({t: "circle", x: q[0], y: q[1], r: rB, fill: FIG_C.acc, stroke: FIG_C.steel, sw: 0.75}); });
  }
  shapes = shapes.concat(dimShapes(x0, y0 + hh + 14, x0 + bw, y0 + hh + 14, "b = " + fmt(o.b, 0) + " mm", 11));
  shapes = shapes.concat(dimShapes(x0 + bw + 20, y0, x0 + bw + 20, y0 + hh, "h = " + fmt(o.h, 0) + " mm", 9));
  var yb = y0 + hh + 14;
  if (o.title) { yb += 30; shapes.push({t: "text", x: x0 + bw / 2, y: yb, s: o.title, size: 10.5, fill: FIG_C.pri, bold: true}); }
  var txp = x0 + bw + 30;
  if (o.labelStir) figLead(shapes, x0 + bw - ins, y0 + hh * 0.3, txp + 40, y0 + 6, o.labelStir);
  if (o.labelBars && n) figLead(shapes, x0 + bw - ins - 2, y0 + hh - ins - 2, txp + 40, y0 + hh + 30, o.labelBars);
  return {w: 420, h: yb + 10, shapes: shapes};
}
// shear friction: interface plane with bars crossing it
function figShearFr(o){
  // elevation of the shear plane: the designed bars cross the interface
  var shapes = [], x0 = 70, y0 = 26, W = 160, Hh = 110;
  shapes.push({t: "rect", x: x0, y: y0, w: W, h: Hh, fill: FIG_C.conc, stroke: FIG_C.pri, sw: 2});
  var yc = y0 + Hh / 2;
  shapes.push({t: "line", x1: x0 - 14, y1: yc, x2: x0 + W + 14, y2: yc, stroke: FIG_C.pri, sw: 1.5, dash: "6 3"});
  shapes.push({t: "text", x: x0 + W + 16, y: yc + 3, s: "shear plane", size: 9, fill: FIG_C.pri, anchor: "start"});
  // shear arrows
  shapes.push({t: "line", x1: x0 + 30, y1: y0 - 8, x2: x0 + W - 30, y2: y0 - 8, stroke: FIG_C.pri, sw: 1.2});
  shapes.push({t: "line", x1: x0 + W - 36, y1: y0 - 11, x2: x0 + W - 30, y2: y0 - 8, stroke: FIG_C.pri, sw: 1.2});
  shapes.push({t: "line", x1: x0 + W - 36, y1: y0 - 5, x2: x0 + W - 30, y2: y0 - 8, stroke: FIG_C.pri, sw: 1.2});
  shapes.push({t: "text", x: x0 + W - 26, y: y0 - 5, s: "Vu", size: 9, fill: FIG_C.pri, anchor: "start", bold: true});
  var n = Math.max(1, Math.min(12, o.n || 1)), k, a = (o.ang || 90) * Math.PI / 180, half = Hh / 2 - 10;
  var dx = half * Math.cos(a) / Math.max(Math.sin(a), 0.2);
  for (k = 0; k < n; k++) {
    var px = n === 1 ? x0 + W / 2 : x0 + 18 + (W - 36) * k / (n - 1);
    shapes.push({t: "line", x1: px - dx, y1: yc + half, x2: px + dx, y2: yc - half, stroke: FIG_C.acc, sw: 2});
  }
  var yb = y0 + Hh + 22;
  if (o.title) { shapes.push({t: "text", x: x0 + W / 2, y: yb, s: o.title, size: 10.5, fill: FIG_C.pri, bold: true}); yb += 13; }
  if (o.label) figLead(shapes, x0 + W - 18 + dx * 0.5, yc + half * 0.5, x0 + W + 16, yc + half + 4, o.label);
  return {w: 400, h: yb + 10, shapes: shapes};
}
// punching: plan - column, critical perimeter at d/2, optional stud rails
function figPunch(o){
  var shapes = [];
  var cx = 150, cy = 0;
  var ext = o.studs ? 2 * (o.studs.X + (o.studs.n - 1) * o.studs.S + o.d / 2) : o.d;
  var sc = Math.min(150 / (o.b + ext), 150 / (o.t + ext));
  var colW = o.b * sc, colH = o.t * sc;
  var perW = (o.b + o.d) * sc, perH = (o.t + o.d) * sc;
  var m = 22;
  cy = 40 + Math.max(perH, o.studs ? (o.t + ext) * sc : 0) / 2 + m;
  var slX = cx - perW / 2 - m, slY = cy - perH / 2 - m, slW = perW + 2 * m, slH = perH + 2 * m;
  var outW = 0, outH = 0, k;
  if (o.studs) {
    var AB = (o.studs.X + (o.studs.n - 1) * o.studs.S + o.d / 2) * sc;
    outW = colW + 2 * AB; outH = colH + 2 * AB;
    slX = Math.min(slX, cx - outW / 2 - m); slY = Math.min(slY, cy - outH / 2 - m);
    slW = Math.max(perW + 2 * m, outW + 2 * m); slH = Math.max(perH + 2 * m, outH + 2 * m);
  }
  shapes.push({t: "rect", x: slX, y: slY, w: slW, h: slH, fill: FIG_C.conc, stroke: FIG_C.mut, sw: 1});
  if (o.studs) shapes.push({t: "rect", x: cx - outW / 2, y: cy - outH / 2, w: outW, h: outH, stroke: FIG_C.mut, sw: 1, dash: "2 2"});
  shapes.push({t: "rect", x: cx - perW / 2, y: cy - perH / 2, w: perW, h: perH, stroke: FIG_C.acc, sw: 1.5, dash: "5 3"});
  shapes.push({t: "rect", x: cx - colW / 2, y: cy - colH / 2, w: colW, h: colH, fill: FIG_C.pri, stroke: FIG_C.pri, sw: 1});
  if (o.studs) {
    var X0 = o.studs.X * sc, Ss = o.studs.S * sc, nn = o.studs.n;
    var rays = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var r = 0; r < 4; r++) {
      var fx = cx + rays[r][0] * colW / 2, fy = cy + rays[r][1] * colH / 2;
      for (k = 0; k < nn; k++) {
        var px = fx + rays[r][0] * (X0 + k * Ss), py = fy + rays[r][1] * (X0 + k * Ss);
        shapes.push({t: "circle", x: px, y: py, r: 2.4, fill: FIG_C.acc, stroke: FIG_C.pri, sw: 0.5});
      }
    }
  }
  // dimensions: column, critical section sides
  if (!o.studs) shapes = shapes.concat(dimShapes(cx - colW / 2, cy + colH / 2 + 8, cx + colW / 2, cy + colH / 2 + 8, fmt(o.b, 0)));
  shapes = shapes.concat(dimShapes(cx - perW / 2, slY - 8, cx + perW / 2, slY - 8, ""));
  shapes.push({t: "text", x: cx, y: slY - 13, s: "b + d = " + fmt(o.b + o.d, 0) + " mm", size: 10, fill: FIG_C.mut});
  shapes = shapes.concat(dimShapes(slX + slW + 10, cy - perH / 2, slX + slW + 10, cy + perH / 2, "", 6));
  shapes.push({t: "text", x: slX + slW + 16, y: cy + 3, s: "t + d = " + fmt(o.t + o.d, 0) + " mm", size: 10, fill: FIG_C.mut, anchor: "start"});
  shapes.push({t: "text", x: cx + perW / 2 - 3, y: cy - perH / 2 - 3, s: "d/2", size: 8.5, fill: FIG_C.acc, anchor: "end"});
  if (o.studs) shapes.push({t: "text", x: cx + outW / 2 - 3, y: cy + outH / 2 - 4, s: "outer bo", size: 8.5, fill: FIG_C.mut, anchor: "end"});
  var yb = slY + slH + 16;
  if (o.title) { shapes.push({t: "text", x: cx, y: yb, s: o.title, size: 10.5, fill: FIG_C.pri, bold: true}); yb += 13; }
  var txr = slX + slW + 16;
  if (o.label && o.studs) figLead(shapes, cx + colW / 2 + (o.studs.X + (o.studs.n - 1) * o.studs.S) * sc, cy, txr, cy + perH / 2 + 26, o.label);
  else if (o.label) figLead(shapes, cx + perW / 2, cy + perH / 2 - 10, txr, cy + perH / 2 + 26, o.label);
  if (o.label2 && o.studs) figLead(shapes, cx + outW / 2, cy + outH / 2 - 14, txr, cy + perH / 2 + 46, o.label2);
  return {w: slX + slW + 16 + 5.6 * Math.max((o.label || "").length, (o.label2 || "").length, 18), h: yb + 6, shapes: shapes};
}
// deflection: member elevation with supports, loads and deflected shape
function figDefl(o){
  var shapes = [];

    for (i = 1; i <= 12; i++) {

      shapes.push({t: "line", x1: sx, y1: yB, x2: sx + 7, y2: yB + 10, stroke: FIG_C.pri, sw: 1.5});
      shapes.push({t: "line", x1: sx - 9, y1: yB + 10, x2: sx + 9, y2: yB + 10, stroke: FIG_C.pri, sw: 1.5});
    }
    for (i = 1; i <= 12; i++) {
      u = i / 12;
      shapes.push({t: "line", x1: x0 + (i - 1) / 12 * Lpx, y1: yB + amp * 4 * (i - 1) / 12 * (1 - (i - 1) / 12), x2: x0 + u * Lpx, y2: yB + amp * 4 * u * (1 - u), stroke: FIG_C.mut, sw: 1, dash: "4 3"});
    }
  }
  var yTop = yB - hpx;
  if (o.w > 0) {

      shapes.push({t: "line", x1: px + 2.5, y1: yTop - 6, x2: px, y2: yTop - 2, stroke: FIG_C.acc, sw: 1.2});
    }
    shapes.push({t: "line", x1: x0 + 8, y1: yTop - 14, x2: x0 + Lpx - 8, y2: yTop - 14, stroke: FIG_C.acc, sw: 1.2});
    shapes.push({t: "text", x: x0 + Lpx, y: yTop - 19, s: "w = " + fmt(o.w, 0) + " kN/m", size: 9, fill: FIG_C.acc, anchor: "end"});
  }
  if (o.P > 0) {
    for (i = 1; i <= 2; i++) {
      px = o.cant ? x0 + Lpx : x0 + Lpx * i / 3;

      shapes.push({t: "line", x1: px - 3.5, y1: yTip - 6, x2: px, y2: yTip, stroke: FIG_C.pri, sw: 1.8});
      shapes.push({t: "line", x1: px + 3.5, y1: yTip - 6, x2: px, y2: yTip, stroke: FIG_C.pri, sw: 1.8});
      shapes.push({t: "text", x: px, y: yTip - 30, s: "P", size: 9.5, fill: FIG_C.pri, bold: true});
      if (o.cant) break;
    }
    shapes.push({t: "text", x: x0, y: yTop - 50, s: "P = " + fmt(o.P, 0) + " kN", size: 9, fill: FIG_C.pri, anchor: "start", bold: true});
  }
  var yD = yB + (o.cant ? amp + 6 : 26);
  shapes = shapes.concat(dimShapes(x0, yD, x0 + Lpx, yD, "L = " + fmt(o.L, 2) + " m", 11));
  var yb = yD + 26;

  return {w: 300, h: yb + 8, shapes: shapes};
}

  var yb = yDm + 18;
  if (o.title) { yb += 30; shapes.push({t: "text", x: x0 + pw / 2, y: yb, s: o.title, size: 10.5, fill: FIG_C.pri, bold: true}); }

// cantilever retaining wall cross-section (dimensions in m)
function figRetWall(o){
  var shapes = [];
  var x0 = 78, y0 = 16;
  var sc = Math.min(150 / (o.B + 2 * o.ex), 110 / (o.hw + o.tb + o.tp));
  var hwH = o.hw * sc, tbH = o.tb * sc, tpH = Math.max(2.5, o.tp * sc);
  var yB = y0 + hwH;
  shapes.push({t: "rect", x: x0, y: yB + tbH, w: (o.B + 2 * o.ex) * sc, h: tpH, fill: FIG_C.conc, stroke: FIG_C.mut, sw: 1});
  shapes.push({t: "rect", x: x0 + o.ex * sc, y: yB, w: o.B * sc, h: tbH, fill: FIG_C.conc, stroke: FIG_C.pri, sw: 2});
  var sx = x0 + (o.ex + o.toe) * sc, sw = o.tw * sc;

  var soilX = sx + sw, soilW = (x0 + (o.ex + o.B) * sc) - soilX;
  if (soilW > 3 && o.hr > 0) {
    var soilH = o.hr * sc;

    shapes.push({t: "line", x1: soilX, y1: yB - soilH, x2: soilX + soilW + 10, y2: yB - soilH, stroke: FIG_C.mut, sw: 1.5});
    shapes.push({t: "text", x: soilX + soilW + 12, y: yB - soilH + 3, s: "soil " + fmt(o.hr, 2) + " m", size: 9, fill: FIG_C.mut, anchor: "start"});
  }
  // designed steel: wall bars on the soil face anchored into the base, base bars at the bottom
  var cvp = 3;
  shapes.push({t: "line", x1: sx + sw - cvp, y1: y0 + cvp, x2: sx + sw - cvp, y2: yB + tbH - cvp, stroke: FIG_C.acc, sw: 1.8});
  shapes.push({t: "line", x1: sx + sw - cvp, y1: yB + tbH - cvp, x2: sx + sw - cvp - 18, y2: yB + tbH - cvp, stroke: FIG_C.acc, sw: 1.8});
  shapes.push({t: "line", x1: x0 + o.ex * sc + cvp, y1: yB + tbH - cvp - 2.5, x2: x0 + (o.ex + o.B) * sc - cvp, y2: yB + tbH - cvp - 2.5, stroke: FIG_C.acc, sw: 1.8});
  figLead(shapes, sx + sw - cvp, y0 + hwH * 0.35, sx + sw + 42, y0 + hwH * 0.35 - 12, o.labelWall || "wall bars");
  shapes.push({t: "text", x: x0 + o.ex * sc + 2, y: yB - 3, s: "toe", size: 8, fill: FIG_C.mut, anchor: "start"});
  if (o.labelBase) figLead(shapes, x0 + (o.ex + o.B * 0.3) * sc, yB + tbH - cvp - 2.5, sx + sw + 42, yB + tbH + 30, o.labelBase);
  shapes.push({t: "text", x: x0 + (o.ex + o.B) * sc - 2, y: yB + tbH + 10 + tpH, s: "", size: 8, fill: FIG_C.mut, anchor: "end"});
  shapes = shapes.concat(dimShapes(x0, yB + tbH + tpH + 14, x0 + (o.B + 2 * o.ex) * sc, yB + tbH + tpH + 14, "B = " + fmt(o.B + 2 * o.ex, 2) + " m", 11));
  shapes = shapes.concat(dimShapes(x0 - 12, y0, x0 - 12, yB, "hw = " + fmt(o.hw, 2) + " m", -8));
  var yb = yB + tbH + tpH + 14;
  if (o.title) { yb += 28; shapes.push({t: "text", x: 150, y: yb, s: o.title, size: 10.5, fill: FIG_C.pri, bold: true}); }
  return {w: 380, h: yb + 8, shapes: shapes};

    XLSX.save(XLSX.build([{name: "Calculation", cols: [70, 16, 10], rows: rows}]), base + ".xlsx");
  } catch (e) { note("Excel export failed: " + e.message); }
}
function handleAction(target){
  var el = target && target.closest ? target.closest("[data-mod],[data-action],[data-view],#backBtn") : null;
  if (!el) return false;
  if (el.id === "backBtn") { if (histPushed) { history.back(); } else { goHome(); } return true; }
  if (el.getAttribute("data-action") === "run") { runMod(); return true; }
  if (el.getAttribute("data-action") === "print") { printSheet(); return true; }
  if (el.getAttribute("data-action") === "doprint") { printGeneratedPdf(); return true; }
  if (el.getAttribute("data-action") === "dlpdf") { downloadPdf(); return true; }
  if (el.getAttribute("data-action") === "dlxlsx") { exportExcel(); return true; }
  if (el.getAttribute("data-action") === "sharepdf") { sharePdf(); return true; }
  if (el.getAttribute("data-action") === "pdm") { setPdm(el.getAttribute("data-pdmv")); return true; }
  if (el.getAttribute("data-action") === "printback") { var pv = g2("printView"); if (pv) pv.remove(); g2("modPage").classList.remove("printing"); return true; }
  var vw = el.getAttribute("data-view");
  if (vw) { setView(vw); return true; }
  var mod = el.getAttribute("data-mod");
  if (mod) { openModule(mod); return true; }
  return false;
}
var lastTouchHandled = 0;
root.addEventListener("touchend", function(e){
  if (handleAction(e.target)) { lastTouchHandled = Date.now(); e.preventDefault(); }
}, {passive: false});
root.addEventListener("click", function(e){
  if (Date.now() - lastTouchHandled < 700) return;
  handleAction(e.target);
});

  window.runMod = runMod;
  window.goHome = goHome;
  window.openModule = openModule;
  window.setPdm = setPdm;
  window.printSheet = printSheet;
  window.__rcPdf = { buildPdf: buildPdf, sheetLines: sheetLines, pileMomentGrid: pileMomentGrid };
}
</script>
<script>
(function(){
  var host = document.getElementById('host');
  var root = host.attachShadow({mode:'open'});
  var st = document.createElement('style');
  st.textContent = appCss;
  root.appendChild(st);
  var wrap = document.createElement('div');
  wrap.innerHTML = appBody;
  root.appendChild(wrap);
  mountRcApp(root);
  if ('serviceWorker' in navigator) {
    var rcHadController = !!navigator.serviceWorker.controller;
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('../sw.js', {updateViaCache: 'none'}).then(function(reg){ reg.update().catch(function(){}); }).catch(function(){});
      var rcReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (rcReloaded || !rcHadController) return;
        rcReloaded = true;
        location.reload();
      });
    });
  }
})();
</script>
