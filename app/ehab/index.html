<script>
function mountRcApp(root) {
  const document = root;

"use strict";
// Engineering core, ACI 318M (SI). Units: mm, MPa, N, N.mm.
var ES = 200000;      // steel modulus, MPa
var EPS_CU = 0.003;   // ultimate concrete strain

// Whitney stress block depth factor beta1 (ACI 318M 22.2.2.4.3)
function beta1ACI(fc) {
  if (fc <= 28) return 0.85;
  return Math.max(0.65, 0.85 - 0.05 * (fc - 28) / 7);
}

// Strength reduction factor phi vs net tensile strain (tied reinforcement).
function phiACI(et, fy) {
  var ety = fy / ES;
  if (et <= ety) return 0.65;                 // compression-controlled (tied)
  if (et >= ety + 0.003) return 0.90;         // tension-controlled
  return 0.65 + (et - ety) * 0.25 / 0.003;    // transition
}

// Nominal axial force at neutral axis depth c (compression +). Layers: [{d, As}].
function axialAt(b, h, layers, fc, fy, c) {
  var a = Math.min(beta1ACI(fc) * c, h);
  var n = 0.85 * fc * b * a;
  for (var i = 0; i < layers.length; i++) {
    var eps = EPS_CU * (c - layers[i].d) / c;
    var fs = Math.max(-fy, Math.min(fy, ES * eps));
    n += fs * layers[i].As;
  }
  return n;
}

// Nominal moment capacity (magnitude) about the gross-section centroid at c.
function momentAt(b, h, layers, fc, fy, c) {
  var a = Math.min(beta1ACI(fc) * c, h);
  var m = 0.85 * fc * b * a * (h / 2 - a / 2);
  for (var i = 0; i < layers.length; i++) {
    var eps = EPS_CU * (c - layers[i].d) / c;
    var fs = Math.max(-fy, Math.min(fy, ES * eps));
    m -= fs * layers[i].As * (layers[i].d - h / 2);
  }
  return m;
}

// Find c for a target nominal axial force. null if out of range.
function neutralAxisForPn(b, h, layers, fc, fy, pnTarget) {
  var lo = 1e-4, hi = 100 * h;
  if (pnTarget > axialAt(b, h, layers, fc, fy, hi)) return null;
  if (pnTarget < axialAt(b, h, layers, fc, fy, lo)) return null;
  for (var i = 0; i < 200; i++) {
    var mid = 0.5 * (lo + hi);
    if (axialAt(b, h, layers, fc, fy, mid) > pnTarget) hi = mid; else lo = mid;
  }
  return 0.5 * (lo + hi);
}

// Combined check at factored (Nu, Mu). Iterates phi (it depends on strain).
// Returns {ok, phiMn, phi, c, et, reason}.
function combinedCheck(b, h, layers, fc, fy, dMax, nuN, muNmm) {
  var asTot = 0;
  for (var i = 0; i < layers.length; i++) asTot += layers[i].As;
  var p0 = 0.85 * fc * (b * h - asTot) + fy * asTot;
  var phiPnMax = 0.80 * 0.65 * p0;           // tied column cap, ACI 318M 22.4.2.2
  if (nuN > phiPnMax) return { ok: false, reason: "phiPnMax", phiPnMax: phiPnMax, p0: p0 };
  if (nuN < -0.9 * fy * asTot) return { ok: false, reason: "tensionCap" };

  var phi = 0.65, c = 0;
  for (var it = 0; it < 60; it++) {
    var cNew = neutralAxisForPn(b, h, layers, fc, fy, nuN / phi);
    if (cNew === null) return { ok: false, reason: "range" };
    c = cNew;
    var et = EPS_CU * (dMax - c) / c;
    var phiNew = phiACI(et, fy);
    if (Math.abs(phiNew - phi) < 1e-4) { phi = phiNew; break; }
    phi = phiNew;
  }
  var etF = EPS_CU * (dMax - c) / c;
  var mn = momentAt(b, h, layers, fc, fy, c);
  return { ok: phi * mn >= muNmm, phiMn: phi * mn, mn: mn, phi: phi, c: c, et: etF,
           phiPnMax: phiPnMax, p0: p0 };
}

// Pure-bending capacity (Nu = 0). Returns {phiMn, c, et, phi}.
function bendingCapacity(b, h, layers, fc, fy, dMax) {
  var c = neutralAxisForPn(b, h, layers, fc, fy, 0);
  if (c === null) return null;
  var et = EPS_CU * (dMax - c) / c;
  var phi = phiACI(et, fy);
  return { phiMn: phi * momentAt(b, h, layers, fc, fy, c), c: c, et: et, phi: phi };
}

// Moment-only design (ACI 318M, phi = 0.90, tension-controlled target et = 0.005).
// Returns {singly, asReq, asPrime, et, a, c, fsPrime, asMin, governedByMin}.
function designMoment(b, h, d, dp, fc, fy, muNmm) {
  var phi = 0.9;
  var mnReq = muNmm / phi;
  var beta1 = beta1ACI(fc);
  var asMin = Math.max(0.25 * Math.sqrt(fc) / fy, 1.4 / fy) * b * d;

  // Try singly reinforced.
  var disc = d * d - 2 * mnReq / (0.85 * fc * b);
  if (disc >= 0) {
    var a = d - Math.sqrt(disc);
    var c = a / beta1;
    var et = EPS_CU * (d - c) / c;
    if (et >= 0.005) {
      var as = 0.85 * fc * a * b / fy;
      var gov = false;
      if (as < asMin) { as = asMin; gov = true; }
      return { singly: true, asReq: as, asPrime: 0, et: et, a: a, c: c, asMin: asMin, governedByMin: gov };
    }
  }
  // Doubly reinforced, set tension strain to 0.005 (tension-controlled limit).
  var c2 = 0.375 * d;
  var a2 = beta1 * c2;
  var mn1 = 0.85 * fc * b * a2 * (d - a2 / 2);
  var dMn = mnReq - mn1;
  var epsSP = EPS_CU * (c2 - dp) / c2;
  var fsPrime = Math.min(fy, ES * epsSP);
  var asPrime = dMn / (fsPrime * (d - dp));
  var as2 = dMn / (fy * (d - dp));
  var as1 = 0.85 * fc * a2 * b / fy;
  return { singly: false, asReq: as1 + as2, asPrime: asPrime, et: 0.005, a: a2, c: c2,
           fsPrime: fsPrime, mn1: mn1, dMn: dMn, asMin: asMin, governedByMin: false };
}

// Design with axial: grow tension steel until combined check passes.
function designWithAxial(b, h, d, dp, asStart, asPrime, fc, fy, muNmm, nuN) {
  var as = asStart, last = null;
  for (var i = 0; i < 300; i++) {
    last = combinedCheck(b, h, [{d: d, As: as}, {d: dp, As: asPrime}], fc, fy, d, nuN, muNmm);
    if (last.reason === "phiPnMax" || last.reason === "tensionCap") return { as: as, ok: false, last: last };
    if (last.ok) return { as: as, ok: true, last: last };
    as *= Math.max(1.01, muNmm / Math.max(last.phiMn, 1));
  }
  return { as: as, ok: false, last: last };
}

// Concrete elastic modulus, ACI 318M 19.2.2.1 (MPa)
function ecACI(fc) { return 4700 * Math.sqrt(fc); }

// Cracked-section neutral axis and moment of inertia (elastic, service).
function crackedSection(b, d, dp, asT, asC, fc) {
  var n = ES / ecACI(fc);
  var A2 = b / 2;
  var B2 = (n - 1) * asC + n * asT;
  var C2 = -((n - 1) * asC * dp + n * asT * d);
  var x = (-B2 + Math.sqrt(B2 * B2 - 4 * A2 * C2)) / (2 * A2);
  var icr = b * Math.pow(x, 3) / 3 + (n - 1) * asC * Math.pow(x - dp, 2) + n * asT * Math.pow(d - x, 2);
  return { x: x, icr: icr, n: n };
}

// ACI 318 10.6 crack control. Returns spacing check + optional Gergely-Lutz estimate.
function crackControl(b, h, d, dp, nb, db, cc, asC, fc, fy, msNmm) {
  var asT = nb * Math.PI / 4 * db * db;
  var fs, fsSource;
  if (msNmm > 0) {
    var cs = crackedSection(b, d, dp, asT, asC, fc);
    fs = cs.n * msNmm * (d - cs.x) / cs.icr;
    fsSource = "calc";
    var x = cs.x;
  } else {
    fs = 2 * fy / 3;
    fsSource = "twoThirds";
    x = null;
  }
  var sMax1 = 380 * (280 / fs) - 2.5 * cc;
  var sMax2 = 300 * (280 / fs);
  var sMax = Math.min(sMax1, sMax2);
  var sActual = (nb > 1) ? (b - 2 * cc - nb * db) / (nb - 1) : Infinity;

  // Gergely-Lutz estimate (NOT in current ACI 318; shown for reference only).
  var wEst = null, beta = null, aEff = null;
  if (x !== null) {
    beta = (h - x) / (d - x);          // h2/h1
    var dc = h - d;
    aEff = 2 * dc * b / nb;            // concrete area per bar
    wEst = 11e-6 * beta * fs * Math.cbrt(dc * aEff);  // mm
  }
  return { fs: fs, fsSource: fsSource, sMax: sMax, sActual: sActual,
           pass: sActual <= sMax, wEst: wEst, beta: beta, x: x };

}

    if (!(i.fc > 0 && i.fy > 0 && i.B > i.c1 && i.L > i.c2 && i.hf > i.cc && i.Pna > 0 && i.s1 > 0 && i.s2 > 0)) return "<span class='bad'>Check the inputs (footing larger than the column, positive spacings).</span>";
    var sq = Math.sqrt(i.fc), b1 = eaB1(i.fc), r = {};
    r.Po = i.PD + i.PL; r.Pu = 1.2 * i.PD + 1.6 * i.PL; r.AFr = r.Po / i.Pna;
    var cb = 2 * (i.c1 + i.c2) / 1000, cq = i.c1 * i.c2 / 1e6 - r.AFr; r.k = (-cb + Math.sqrt(cb * cb - 16 * cq)) / 8;
    r.Lcal = Math.ceil((i.c2 + 2 * r.k * 1000) / 100 - 1e-9) * 100; r.Bcal = Math.ceil(r.AFr * 1e6 / r.Lcal / 100 - 1e-9) * 100;
    r.AF = i.B * i.L / 1e6; r.q = r.Po / r.AF; r.qs = r.Pu / r.AF; var okA = r.q <= i.Pna;
    var d = i.hf - i.cc;
    // one-way shear, both directions (correction)
    r.A1B = i.B / 1000 * ((i.L - i.c2) / 2000 - d / 1000); r.A1L = i.L / 1000 * ((i.B - i.c1) / 2000 - d / 1000);
    r.Vu1B = r.qs * Math.max(0, r.A1B); r.Vu1L = r.qs * Math.max(0, r.A1L);
    r.Vc1B = i.phiv * 0.17 * i.lam * sq * i.B * d / 1000; r.Vc1L = i.phiv * 0.17 * i.lam * sq * i.L * d / 1000;
    var ok1 = r.Vu1B <= r.Vc1B && r.Vu1L <= r.Vc1L;
    // punching
    r.A2 = i.B * i.L / 1e6 - (i.c1 + d) * (i.c2 + d) / 1e6; r.Vu2 = r.qs * r.A2; r.bo = 2 * (i.c1 + d) + 2 * (i.c2 + d);
    r.beta = Math.max(i.c1, i.c2) / Math.min(i.c1, i.c2);
    r.Vp1 = 0.33 * i.lam * sq * r.bo * d / 1000; r.Vp2 = 0.17 * (1 + 2 / r.beta) * i.lam * sq * r.bo * d / 1000; r.Vp3 = 0.083 * (2 + 40 * d / r.bo) * i.lam * sq * r.bo * d / 1000;

    // flexure

      o.rmin = i.fy < 420 ? 0.002 : Math.max(0.0014, 0.0018 * 420 / i.fy); o.Amin = o.rmin * w * i.hf; o.Areq = Math.max(o.Amin, o.rho * w * d);
      o.Ab = Math.PI / 4 * db * db; o.Aprov = o.Ab * w / s; o.rmax = 0.85 * b1 * i.fc / i.fy * 0.375; o.Amax = o.rmax * w * d; o.ok = o.Aprov >= o.Areq && o.Aprov <= o.Amax; return o;
    }
    var F1 = flex(r.qs * i.B / 1000 * Math.pow((i.L - i.c2) / 2000, 2) / 2, i.B, i.db1, i.s1);

    // band of the short-direction bars (13.3.3.3) - added
    r.bf = i.L / i.B; r.gs = 2 / (r.bf + 1); r.Aband = r.gs * F2.Areq; r.AbandP = F2.Ab * i.B / i.s2; r.sBand = Math.floor(F2.Ab * i.B / r.Aband / 5 + 1e-9) * 5;
    var okBand = r.bf <= 1.001 || r.AbandP >= r.Aband;
    // bearing
    r.A1 = i.c1 * i.c2; r.x = Math.min((i.L - i.c2) / 2, (i.B - i.c1) / 2); r.A2b = (i.c1 + 2 * r.x) * (i.c2 + 2 * r.x);

    r.rt = Math.min(Math.sqrt(r.A2b / r.A1), 2); r.phBn = i.phibr * 0.85 * i.fc * r.A1 * r.rt / 1000; var okBr = r.phBn >= r.Pu;
    // dowels
    r.Adr = 0.005 * i.c1 * i.c2; r.Adp = i.nd * Math.PI / 4 * i.dbd * i.dbd; var okD = r.Adp >= r.Adr && i.nd >= 4;
    r.ldc = Math.max(0.24 * i.fy * i.psir / (i.lam * sq) * i.dbd, 0.043 * i.fy * i.psir * i.dbd, 200);

    }

    var ok = okA && ok1 && ok2 && F1.ok && F2.ok && okBand && okBr && okD && okH && D1.ok && D2.ok;

    var lab1 = "T" + i.db1 + " @ " + fmt(i.s1, 0) + " mm (along L)", lab2 = "T" + i.db2 + " @ " + fmt(i.s2, 0) + " mm (along B)";

    var chk = function(c, t){ return [t, c ? "<span class='ok'>OK</span>" : "<span class='bad'>NOT OK</span>"]; };
    out += rows([chk(okA, "Soil pressure " + fmt(r.q, 1) + " ≤ " + fmt(i.Pna, 0) + " kN/m²"), chk(ok1, "One-way shear"), chk(ok2, "Punching shear: V" + S("u") + " = " + fmt(r.Vu2, 0) + ", φV" + S("c") + " = " + fmt(r.phVp, 0) + " kN"),
      chk(F1.ok, "Bars along L: A" + S("s,req") + " = " + fmt(F1.Areq, 0) + ", provided " + fmt(F1.Aprov, 0) + " mm²"), chk(F2.ok, "Bars along B: A" + S("s,req") + " = " + fmt(F2.Areq, 0) + ", provided " + fmt(F2.Aprov, 0) + " mm²"),
      chk(okBand, "Band of short bars (13.3.3.3)" + (okBand ? "" : ": use s = " + r.sBand + " mm inside width B")), chk(okBr, "Bearing on the footing"), chk(okD, "Dowels " + i.nd + "T" + i.dbd), chk(okH, "Footing depth for ℓdc"), chk(D1.ok && D2.ok, "Development of the bottom bars")]);
    out += big(ok ? "<span class='ok'>✓ Valid design</span>" : "<span class='bad'>✗ Invalid design: see the checks</span>");

    var ws = wsHead("isolated footing (ACI 318M-14)");

    ws += E3("q" + S("s") + " = " + fr("P" + S("u"), "B L"), "q" + S("s") + " = " + fr(fmt(r.Pu, 1), fmt(r.AF, 3)), "q" + S("s") + " = " + fmt(r.qs, 1) + " kN/m²");

    ws += E3("β = " + fr("max(c" + S("1") + ", c" + S("2") + ")", "min(c" + S("1") + ", c" + S("2") + ")"), "β = " + fr(fmt(Math.max(i.c1, i.c2), 0), fmt(Math.min(i.c1, i.c2), 0)), "β = " + fmt(r.beta, 3));
    ws += E3("V" + S("c1") + " = 0.33 λ " + rad("f'" + S("c")) + " b" + S("o") + " d", "V" + S("c1") + " = 0.33 × " + fmt(i.lam, 2) + " × " + rad(fmt(i.fc, 1)) + " × " + fmt(r.bo, 0) + " × " + fmt(d, 0) + " / 1000", "V" + S("c1") + " = " + fmt(r.Vp1, 1) + " kN");

    ws += E3("φV" + S("c") + " = φ min(V" + S("c1") + ", V" + S("c2") + ", V" + S("c3") + ")", "φV" + S("c") + " = " + fmt(i.phiv, 2) + " × " + fmt(Math.min(r.Vp1, r.Vp2, r.Vp3), 1), "φV" + S("c") + " = " + fmt(r.phVp, 1) + " kN " + (ok2 ? "≥ " : "< ") + fmt(r.Vu2, 1) + " → " + (ok2 ? "OK" : "increase depth"));

    ws += E3("A" + S("1") + " = c" + S("1") + " c" + S("2"), "A" + S("1") + " = " + fmt(i.c1, 0) + " × " + fmt(i.c2, 0), "A" + S("1") + " = " + fmt(r.A1, 0) + " mm²");

// corbel elevation: Asc with hook into the column and anchor bar, horizontal ties Ah within 2/3 d
function figEaCorbel(o){
  var sh = [], sc = Math.min(200 / (o.Lc + o.Cx), 190 / (o.h + 200)), x0 = 80, y0 = 50;
  var cw = o.Cx * sc, colH = (o.h + 200) * sc, xf = x0 + cw, yTop = y0 + 60 * sc + 30, hh = o.h * sc, hp = o.hp * sc, Lc = o.Lc * sc;
  sh.push({t: "rect", x: x0, y: y0, w: cw, h: colH + 40, fill: FIG_C.conc, stroke: FIG_C.pri, sw: 2});
  // corbel outline (polygon by lines + fill rect for the rectangular part)
  sh.push({t: "rect", x: xf, y: yTop, w: Lc, h: hp, fill: FIG_C.conc, stroke: FIG_C.conc, sw: 0});
  var nF = 14; for (var k = 0; k < nF; k++) { var xa = xf + Lc * k / nF, hk = hp + (hh - hp) * (1 - (k + 0.5) / nF); sh.push({t: "rect", x: xa, y: yTop + hp - 0.5, w: Lc / nF + 0.6, h: hk - hp + 0.5, fill: FIG_C.conc, stroke: FIG_C.conc, sw: 0}); }
  sh.push({t: "line", x1: xf, y1: yTop, x2: xf + Lc, y2: yTop, stroke: FIG_C.pri, sw: 2});
  sh.push({t: "line", x1: xf + Lc, y1: yTop, x2: xf + Lc, y2: yTop + hp, stroke: FIG_C.pri, sw: 2});
  sh.push({t: "line", x1: xf + Lc, y1: yTop + hp, x2: xf, y2: yTop + hh, stroke: FIG_C.pri, sw: 2});
  sh.push({t: "line", x1: xf, y1: y0, x2: xf, y2: yTop, stroke: FIG_C.pri, sw: 2});
  sh.push({t: "line", x1: xf, y1: yTop + hh, x2: xf, y2: y0 + colH + 40, stroke: FIG_C.pri, sw: 2});
  // bearing plate and loads
  var xp = xf + o.e1 * sc, wp = o.LBP * sc, xV = xf + o.av * sc;
  sh.push({t: "rect", x: xp, y: yTop - 5, w: wp, h: 5, fill: FIG_C.steel, stroke: FIG_C.steel, sw: 0.5});
  eaArrowDown(sh, xV, yTop - 40, yTop - 7, FIG_C.pri);
  sh.push({t: "text", x: xV + 5, y: yTop - 30, s: "Vu = " + fmt(o.Vu, 0) + " kN", size: 9.5, fill: FIG_C.pri, anchor: "start", bold: true});
  eaArrowH(sh, xp + wp - 2, xp + wp + 34, yTop - 12, FIG_C.acc);
  sh.push({t: "text", x: xp + wp + 38, y: yTop - 9, s: "Nuc = " + fmt(o.Nuc, 0) + " kN", size: 9.5, fill: FIG_C.acc, anchor: "start", bold: true});
  // Asc: top bars, hooked down in the column, welded to the anchor bar at the outer end
  var ya = yTop + o.cc * sc, xh = x0 + 10, xe = xf + Lc - Math.max(6, o.cs * sc);
  sh.push({t: "line", x1: xh, y1: ya, x2: xe, y2: ya, stroke: FIG_C.acc, sw: 2.2});
  sh.push({t: "line", x1: xh, y1: ya, x2: xh, y2: ya + 12 * o.dbT * sc + 10, stroke: FIG_C.acc, sw: 2.2});
  sh.push({t: "circle", x: xe + 3, y: ya, r: Math.max(3, o.dba * sc / 2 + 1), fill: FIG_C.ok, stroke: FIG_C.steel, sw: 0.8});
  // Ah: closed ties within 2/3 d below Asc
  var d = o.h - o.cc, z = 2 / 3 * d * sc, n = Math.max(1, o.nH);
  for (k = 1; k <= n; k++) {
    var y = ya + z * k / (n + 0.5), xr = xf + Lc - 8 - (y - yTop - hp > 0 ? (y - yTop - hp) * Lc / (hh - hp) : 0);
    sh.push({t: "line", x1: xf - 14, y1: y, x2: xr, y2: y, stroke: FIG_C.pri, sw: 1.4});
  }
  sh = sh.concat(dimShapes(x0 - 14, yTop, x0 - 14, yTop + hh, "h = " + fmt(o.h, 0) + " mm", -6));
  sh = sh.concat(dimShapes(xf + Lc + 12, yTop, xf + Lc + 12, yTop + hp, "h' = " + fmt(o.hp, 0) + " mm", 5));
  sh = sh.concat(dimShapes(xf - 12, ya, xf - 12, ya + z, "", -5));
  sh.push({t: "text", x: xf - 16, y: ya + z + 12, s: "⅔d = " + fmt(2 / 3 * d, 0) + " mm", size: 9, fill: FIG_C.mut, anchor: "end"});
  sh = sh.concat(dimShapes(xf, yTop - 50, xV, yTop - 50, "av = " + fmt(o.av, 0) + " mm"));
  sh[sh.length - 1].y = yTop - 55;
  var tx = xf + Lc + 78, ty = yTop + hp + 26;
  figLead(sh, xe - 20, ya, tx, ty, "Asc: " + o.labT, FIG_C.acc);
  var yt1 = ya + z / (n + 0.5);
  figLead(sh, xf + Lc * 0.5, yt1, tx, ty + 15, "Ah: " + o.labH + " (closed ties)", FIG_C.pri);
  figLead(sh, xe + 3, ya + 3, tx, ty + 30, "anchor bar T" + o.dba, FIG_C.ok);
  var yEnd = Math.max(y0 + colH + 40, ty + 34);
  return {w: tx + 6 * (o.labH.length + 18), h: yEnd + 8, shapes: sh};
}

// section with tension and compression steel given as areas (deflection), plus span sketch
function figEaDefl(o){
  var sh = [], x0 = 112, y0 = 24, sc = Math.min(120 / o.b, 110 / o.h), bw = o.b * sc, hh = o.h * sc, k;
  if (bw < 40) { bw = 40; }
  sh.push({t: "rect", x: x0, y: y0, w: bw, h: hh, fill: FIG_C.conc, stroke: FIG_C.pri, sw: 2});
  var yt = y0 + hh - Math.max(5, o.Ct * sc), yc = y0 + Math.max(5, o.Cc * sc), n = 6;
  for (k = 0; k < n; k++) sh.push({t: "circle", x: x0 + 8 + (bw - 16) * k / (n - 1), y: yt, r: 2.6, fill: FIG_C.acc, stroke: FIG_C.steel, sw: 0.7});
  if (o.As2 > 0) for (k = 0; k < n; k++) sh.push({t: "circle", x: x0 + 8 + (bw - 16) * k / (n - 1), y: yc, r: 2.4, fill: FIG_C.acc, stroke: FIG_C.steel, sw: 0.7});
  sh = sh.concat(dimShapes(x0, y0 + hh + 14, x0 + bw, y0 + hh + 14, "b = " + fmt(o.b, 0) + " mm"));
  sh = sh.concat(dimShapes(x0 - 12, y0, x0 - 12, y0 + hh, "h = " + fmt(o.h, 0) + " mm", -6));
  var tx = x0 + bw + 14;
  if (o.As2 > 0) figLead(sh, x0 + bw - 8, yc, tx, y0 + 4, "As' = " + fmt(o.As2, 0) + " mm²", FIG_C.acc);
  figLead(sh, x0 + bw - 8, yt, tx, y0 + hh + 2, "As = " + fmt(o.As, 0) + " mm²", FIG_C.acc);
  // span sketch
  var sx = tx + 120, sw = 200, by = y0 + 50;
  sh.push({t: "line", x1: sx, y1: by, x2: sx + sw, y2: by, stroke: FIG_C.pri, sw: 3});
  for (k = 0; k <= 10; k++) eaArrowDown(sh, sx + sw * k / 10, by - 26, by - 3, FIG_C.mut);
  sh.push({t: "line", x1: sx, y1: by - 26, x2: sx + sw, y2: by - 26, stroke: FIG_C.mut, sw: 1});
  [sx, sx + sw].forEach(function(x){ sh.push({t: "line", x1: x, y1: by + 2, x2: x - 7, y2: by + 13, stroke: FIG_C.pri, sw: 1.4}); sh.push({t: "line", x1: x, y1: by + 2, x2: x + 7, y2: by + 13, stroke: FIG_C.pri, sw: 1.4}); sh.push({t: "line", x1: x - 10, y1: by + 13, x2: x + 10, y2: by + 13, stroke: FIG_C.pri, sw: 1.4}); });
  var px = sx, py = by;
  for (k = 1; k <= 16; k++) { var xx = sx + sw * k / 16, yy = by + 22 * Math.sin(Math.PI * k / 16); sh.push({t: "line", x1: px, y1: py, x2: xx, y2: yy, stroke: FIG_C.acc, sw: 1.2, dash: "4 3"}); px = xx; py = yy; }
  sh = sh.concat(dimShapes(sx + sw / 2 + 4, by, sx + sw / 2 + 4, by + 22, "Δ", 5));
  sh = sh.concat(dimShapes(sx, by + 36, sx + sw, by + 36, "L = " + fmt(o.L / 1000, 2) + " m"));
  sh.push({t: "text", x: sx + sw / 2, y: by - 32, s: "service loads (M from DL, LL, sustained)", size: 9, fill: FIG_C.mut});
  return {w: sx + sw + 20, h: Math.max(y0 + hh + 30, by + 56), shapes: sh};
}

// punching: geometry of the critical section for the four column cases (PCA Notes, ACI 318M-14 8.4.4.2)
function eaPunchGeo(cs, C1, C2, d, e1, e2, inef){
  var g = {cs: cs};
  if (cs === "Interior") { g.b1 = C1 + d; g.b2 = C2 + d; g.bo = 2 * (g.b1 + g.b2); g.as = 40; g.sides = 4; g.colP = 2 * C1 + 2 * C2; g.k = 4; }
  else if (cs === "Edge Case (1)") { g.b1 = C1 + d; g.b2 = C2 + 0.5 * d + e2; g.bo = g.b1 + 2 * g.b2; g.as = 30; g.sides = 3; g.colP = C1 + 2 * C2; g.k = 2; }
  else if (cs === "Edge Case (2)") { g.b1 = C1 + 0.5 * d + e1; g.b2 = C2 + d; g.bo = 2 * g.b1 + g.b2; g.as = 30; g.sides = 3; g.colP = 2 * C1 + C2; g.k = 2; }
  else { g.b1 = C1 + 0.5 * d + e1; g.b2 = C2 + 0.5 * d + e2; g.bo = g.b1 + g.b2; g.as = 20; g.sides = 2; g.colP = C1 + C2; g.k = 1; }

// composite beam: section with the deck, slab, studs and the steel I-section
function figEaComp(o){
  var sh = [], H = o.d + o.t, sc = 170 / H, x0 = 120, y0 = 44, W = Math.min(o.beff * sc, 330), cx = x0 + W / 2;

  if (o.deck === 2) {   // ribs parallel to the beam: ribs cut in this section

  if (o.beff * sc > W + 1) [x0, x0 + W].forEach(function(x){ sh.push({t: "line", x1: x, y1: yTop - 4, x2: x - 4, y2: yTop + 6, stroke: FIG_C.txt, sw: 1}); sh.push({t: "line", x1: x - 4, y1: yTop + 6, x2: x + 4, y2: yTop + 10, stroke: FIG_C.txt, sw: 1}); sh.push({t: "line", x1: x + 4, y1: yTop + 10, x2: x, y2: yDeck + 4, stroke: FIG_C.txt, sw: 1}); });

  sh.push({t: "rect", x: cx - tw / 2, y: ySt + tf, w: tw, h: o.d * sc - 2 * tf, fill: FIG_C.steel, stroke: FIG_C.steel, sw: 1});

  if (o.pna !== null) { var yp = yTop + o.pna * sc; sh.push({t: "line", x1: x0 - 6, y1: yp, x2: x0 + W + 6, y2: yp, stroke: [0.70, 0.20, 0.20], sw: 1, dash: "6 3"}); sh.push({t: "text", x: x0 + W + 14, y: yp + 3, s: "PNA", size: 9, fill: [0.70, 0.20, 0.20]}); }

  sh = sh.concat(dimShapes(x0 - 14, yTop, x0 - 14, yDeck, "tc = " + fmt(o.tc, 0), -6));

// prestressed section: strands, bars, stress block
function figEaFps(o){
  var sh = [], sc = Math.min(260 / o.b, 120 / o.h), x0 = 90, y0 = 26, W = o.b * sc, H = o.h * sc, k;
  sh.push({t: "rect", x: x0, y: y0, w: W, h: H, fill: FIG_C.conc, stroke: FIG_C.pri, sw: 2});
  var a = Math.min(o.a, o.h) * sc;
  sh.push({t: "rect", x: x0, y: y0, w: W, h: a, fill: [0.98, 0.88, 0.80], stroke: FIG_C.acc, sw: 0.8});
  var yp = y0 + H - Math.max(5, o.Cc * sc), np = Math.min(o.n, 14), nb = 4;
  for (k = 0; k < np; k++) sh.push({t: "circle", x: x0 + 12 + (W - 24) * (np === 1 ? 0.5 : k / (np - 1)), y: yp, r: 3, fill: FIG_C.acc, stroke: FIG_C.steel, sw: 0.8});
  if (o.As > 0) for (k = 0; k < nb; k++) sh.push({t: "rect", x: x0 + 20 + (W - 40) * k / (nb - 1) - 2.2, y: yp - 10 - 2.2, w: 4.4, h: 4.4, fill: FIG_C.steel, stroke: FIG_C.steel, sw: 0.5});
  sh = sh.concat(dimShapes(x0, y0 + H + 14, x0 + W, y0 + H + 14, "b = " + fmt(o.b, 0) + " mm"));
  sh = sh.concat(dimShapes(x0 - 14, y0, x0 - 14, y0 + H, "h = " + fmt(o.h, 0), -6));
  var tx = x0 + W + 16;
  figLead(sh, x0 + W - 6, y0 + a / 2, tx, y0 + 6, "a = " + fmt(o.a, 1) + " mm (0.85f'c)", FIG_C.acc);
  figLead(sh, x0 + W - 12, yp, tx, y0 + H + 4, o.n + " strands, Aps = " + fmt(o.Aps, 0) + " mm²", FIG_C.acc);
  if (o.As > 0) figLead(sh, x0 + W - 20, yp - 10, tx, y0 + H - 18, "As = " + fmt(o.As, 0) + " mm²", FIG_C.pri);
  sh.push({t: "text", x: x0 + 8, y: y0 + a + 13, anchor: "start", s: "d = dp = " + fmt(o.d, 0) + " mm", size: 9, fill: FIG_C.mut});
  return {w: tx + 160, h: y0 + H + 30, shapes: sh};
}
